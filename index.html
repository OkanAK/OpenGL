<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ARENA FPS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
canvas { display:block; }

/* ---- Screens ---- */
.screen {
  position:fixed; inset:0;
  background:rgba(0,0,10,0.92);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; z-index:100;
}
.screen h1 {
  font-size:58px; letter-spacing:10px; color:#ff8800; margin-bottom:6px;
  text-shadow: 0 0 40px rgba(255,136,0,0.7), 0 0 80px rgba(255,136,0,0.3);
}
.screen .sub { color:#666; font-size:13px; letter-spacing:3px; margin-bottom:44px; }
.ctrl-grid {
  display:grid; grid-template-columns:auto auto; gap:10px 48px;
  margin-bottom:44px; font-size:15px;
}
.k { color:#ff8800; font-weight:bold; text-align:right; }
.d { color:#999; }
.btn {
  padding:14px 52px; background:#ff8800; color:#000;
  border:none; cursor:pointer; font-size:18px; font-family:inherit;
  font-weight:bold; letter-spacing:4px; text-transform:uppercase;
  transition:background .1s, transform .1s; outline:none;
}
.btn:hover { background:#ffaa00; transform:scale(1.04); }
.btn:active { transform:scale(.97); }
#go-stats { margin:18px 0 24px; text-align:center; color:#aaa; font-size:17px; line-height:2; }
#go-stats b { color:#ff8800; }

/* ---- HUD ---- */
#hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }

/* crosshair */
#xhair {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:24px; height:24px; pointer-events:none;
}
#xhair::before, #xhair::after {
  content:''; position:absolute; background:rgba(255,255,255,.85);
  border-radius:1px;
}
#xhair::before { width:24px; height:2px; top:11px; left:0; }
#xhair::after  { width:2px; height:24px; top:0; left:11px; }
#xhair.hit::before, #xhair.hit::after { background:#f33; }

/* top bar */
#hud-top {
  position:absolute; top:0; left:0; right:0; padding:18px 24px;
  display:flex; justify-content:space-between; align-items:flex-start;
  background:linear-gradient(to bottom, rgba(0,0,0,.55), transparent);
}
.score-block { line-height:1.3; }
.score-block .label { color:#888; font-size:11px; letter-spacing:3px; }
.score-block .value { color:#fff; font-size:22px; }
#wave-val { color:#ff8800; }

/* bottom bar */
#hud-bot {
  position:absolute; bottom:0; left:0; right:0; padding:18px 24px;
  display:flex; justify-content:space-between; align-items:flex-end;
  background:linear-gradient(to top, rgba(0,0,0,.55), transparent);
}
#hp-label { color:#888; font-size:11px; letter-spacing:3px; }
#hp-bar {
  width:180px; height:10px; background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.25); border-radius:2px; overflow:hidden;
  margin:5px 0;
}
#hp-fill { height:100%; background:#0f0; transition:width .15s, background .3s; border-radius:2px; }
#hp-text { color:#fff; font-size:16px; font-weight:bold; }
#ammo-block { text-align:right; }
#ammo-cur { color:#fff; font-size:36px; font-weight:bold; }
#ammo-sep { color:#555; font-size:28px; }
#ammo-res { color:#888; font-size:22px; }

/* reload text */
#reload-msg {
  position:absolute; bottom:68px; right:24px; color:#ff0;
  font-size:13px; letter-spacing:2px; display:none;
  animation:pulse .5s infinite alternate;
}
@keyframes pulse { from{opacity:.6} to{opacity:1} }

/* wave announce */
#wave-ann {
  position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
  color:#ff8800; font-size:50px; font-weight:bold; letter-spacing:6px;
  text-align:center; text-shadow:0 0 30px rgba(255,136,0,.8);
  opacity:0; transition:opacity .4s; pointer-events:none;
}

/* hit flash */
#hit-flash {
  position:fixed; inset:0; background:rgba(255,0,0,0);
  pointer-events:none; z-index:9; transition:background .12s ease-out;
}

/* kill feed */
#killfeed {
  position:absolute; top:80px; right:24px;
  display:flex; flex-direction:column; gap:5px; align-items:flex-end;
}
.kf-msg { color:#fa0; font-size:14px; animation:kfFade 2.2s forwards; }
@keyframes kfFade {
  0%  { opacity:1; transform:translateX(0); }
  80% { opacity:1; }
  100%{ opacity:0; transform:translateX(16px); }
}

/* enemy hp bars (HTML overlay) */
#enemy-bars { position:fixed; inset:0; pointer-events:none; z-index:8; }
.ebar {
  position:absolute; transform:translate(-50%,-100%);
  width:60px; display:flex; flex-direction:column; align-items:center; gap:2px;
}
.ebar-bg {
  width:100%; height:6px; background:rgba(0,0,0,.5);
  border:1px solid rgba(255,0,0,.4); border-radius:2px; overflow:hidden;
}
.ebar-fill { height:100%; background:#f00; border-radius:2px; transition:width .1s; }
</style>
</head>
<body>

<!-- Start Screen -->
<div id="start-screen" class="screen">
  <h1>ARENA FPS</h1>
  <div class="sub">SURVIVE THE WAVES</div>
  <div class="ctrl-grid">
    <span class="k">W A S D</span><span class="d">Move</span>
    <span class="k">MOUSE</span><span class="d">Aim</span>
    <span class="k">LEFT CLICK</span><span class="d">Shoot (hold)</span>
    <span class="k">R</span><span class="d">Reload</span>
    <span class="k">SPACE</span><span class="d">Jump</span>
    <span class="k">SHIFT</span><span class="d">Sprint</span>
  </div>
  <button class="btn" id="start-btn">CLICK TO PLAY</button>
</div>

<!-- Game Over Screen -->
<div id="go-screen" class="screen" style="display:none">
  <h1>YOU DIED</h1>
  <div class="sub">GAME OVER</div>
  <div id="go-stats"></div>
  <button class="btn" id="replay-btn">PLAY AGAIN</button>
</div>

<!-- HUD -->
<div id="hud">
  <div id="hit-flash"></div>
  <div id="xhair"></div>

  <div id="hud-top">
    <div class="score-block">
      <div class="label">SCORE</div>
      <div class="value" id="score-val">0</div>
    </div>
    <div class="score-block" style="text-align:right">
      <div class="label" style="text-align:right">WAVE</div>
      <div class="value" id="wave-val">1</div>
    </div>
  </div>

  <div id="hud-bot">
    <div>
      <div id="hp-label">HEALTH</div>
      <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
      <div id="hp-text">100</div>
    </div>
    <div id="ammo-block">
      <span id="ammo-cur">30</span><span id="ammo-sep"> / </span><span id="ammo-res">90</span>
    </div>
  </div>

  <div id="reload-msg">RELOADING…</div>
  <div id="wave-ann"></div>
  <div id="killfeed"></div>
</div>

<!-- Enemy HP bars live here -->
<div id="enemy-bars"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ===================================================================
//  ARENA FPS
// ===================================================================

// ---- Renderer --------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080810);
scene.fog = new THREE.FogExp2(0x080810, 0.028);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.05, 200);
scene.add(camera); // needed for child gun mesh

// ---- Constants -------------------------------------------------
const ARENA   = 22;   // half-extent
const WALL_H  = 8;
const PLR_H   = 1.7;  // eye height
const PLR_R   = 0.45; // collision radius
const GRAVITY = -22;
const JUMP_V  = 9;
const SPEED   = 7;
const SPRINT  = 1.7;
const MAX_CLIP = 30;
const RESERVE  = 90;
const RELOAD_T = 2.0;
const FIRE_RATE = 0.09; // seconds between shots
const GUN_DMG  = 28;

// ---- Game state ------------------------------------------------
let gState = 'menu'; // menu | playing | dead
let score = 0, wave = 1, kills = 0;
let waveTransition = false, waveTimer = 0;

// ---- Player ----------------------------------------------------
const player = {
  pos:       new THREE.Vector3(0, PLR_H, 0),
  vel:       new THREE.Vector3(),
  hp:        100,
  onGround:  false,
  ammo:      MAX_CLIP,
  reserve:   RESERVE,
  reloading: false,
  reloadT:   0,
  shootT:    0,
};

// ---- Camera look -----------------------------------------------
let yaw = 0, pitch = 0;
let camBobT = 0;

// ---- Input -----------------------------------------------------
const keys   = new Set();
let shooting = false, locked = false;

// ---- Collections -----------------------------------------------
const enemies   = [];
const particles = [];
const tracers   = [];
const obstacles = []; // { min: V3, max: V3 }

// ---- Enemy HP bar DOM elements ---------------------------------
const ebarContainer = document.getElementById('enemy-bars');
let eidCounter = 0;

// ===================================================================
//  AUDIO (Web Audio API — simple synthesised sounds)
// ===================================================================
let audioCtx = null;
function audio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(type) {
  try {
    const ctx = audio();
    const g = ctx.createGain();
    g.connect(ctx.destination);
    const o = ctx.createOscillator();
    o.connect(g);
    const t = ctx.currentTime;
    if (type === 'shoot') {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(260, t);
      o.frequency.exponentialRampToValueAtTime(55, t + .09);
      g.gain.setValueAtTime(.18, t);
      g.gain.exponentialRampToValueAtTime(.001, t + .1);
      o.start(t); o.stop(t + .1);
    } else if (type === 'hit') {
      o.type = 'sine';
      o.frequency.setValueAtTime(900, t);
      o.frequency.exponentialRampToValueAtTime(400, t + .06);
      g.gain.setValueAtTime(.22, t);
      g.gain.exponentialRampToValueAtTime(.001, t + .06);
      o.start(t); o.stop(t + .06);
    } else if (type === 'kill') {
      o.type = 'sine'; o.frequency.setValueAtTime(500, t);
      g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
      o.start(t); o.stop(t + .2);
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type = 'sine'; o2.frequency.setValueAtTime(800, t + .07);
      g2.gain.setValueAtTime(.18, t + .07); g2.gain.exponentialRampToValueAtTime(.001, t + .25);
      o2.start(t + .07); o2.stop(t + .25);
    } else if (type === 'hurt') {
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(50, t + .25);
      g.gain.setValueAtTime(.3, t); g.gain.exponentialRampToValueAtTime(.001, t + .25);
      o.start(t); o.stop(t + .25);
    } else if (type === 'reload') {
      o.type = 'square'; o.frequency.setValueAtTime(280, t); o.frequency.setValueAtTime(180, t + .06);
      g.gain.setValueAtTime(.1, t); g.gain.exponentialRampToValueAtTime(.001, t + .12);
      o.start(t); o.stop(t + .12);
    } else if (type === 'empty') {
      o.type = 'square'; o.frequency.setValueAtTime(90, t);
      g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + .06);
      o.start(t); o.stop(t + .06);
    } else if (type === 'wave') {
      o.type = 'sine';
      o.frequency.setValueAtTime(300, t); o.frequency.linearRampToValueAtTime(900, t + .5);
      g.gain.setValueAtTime(.15, t); g.gain.exponentialRampToValueAtTime(.001, t + .55);
      o.start(t); o.stop(t + .55);
    }
  } catch(_) {}
}

// ===================================================================
//  WORLD BUILDING
// ===================================================================
const matFloor   = new THREE.MeshLambertMaterial({ color: 0x111122 });
const matCeil    = new THREE.MeshLambertMaterial({ color: 0x0a0a1a, side: THREE.BackSide });
const matWall    = new THREE.MeshLambertMaterial({ color: 0x14142a });
const matBox     = new THREE.MeshLambertMaterial({ color: 0x1e1e3c });
const matBoxAcct = new THREE.MeshLambertMaterial({ color: 0x2a2a50 });

function buildWorld() {
  // Floor
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2, ARENA*2, 22, 22), matFloor);
  floor.rotation.x = -Math.PI/2; floor.receiveShadow = true;
  scene.add(floor);

  // Grid
  const grid = new THREE.GridHelper(ARENA*2, 22, 0x1a1a35, 0x1a1a35);
  scene.add(grid);

  // Ceiling
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2, ARENA*2), matCeil);
  ceil.position.y = WALL_H; ceil.rotation.x = Math.PI/2;
  scene.add(ceil);

  // Walls
  const wallSegs = [
    { pos:[0, WALL_H/2, -ARENA], ry:0,          size:[ARENA*2, WALL_H] },
    { pos:[0, WALL_H/2,  ARENA], ry:Math.PI,     size:[ARENA*2, WALL_H] },
    { pos:[-ARENA, WALL_H/2, 0], ry: Math.PI/2,  size:[ARENA*2, WALL_H] },
    { pos:[ ARENA, WALL_H/2, 0], ry:-Math.PI/2,  size:[ARENA*2, WALL_H] },
  ];
  for (const w of wallSegs) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w.size[0], w.size[1]), matWall);
    m.position.set(...w.pos); m.rotation.y = w.ry; m.receiveShadow = true;
    scene.add(m);
  }

  // Edge accent lights (strip lights along base of walls)
  const stripCfgs = [
    [0, 0.08, -ARENA + .15], [0, 0.08,  ARENA - .15],
    [-ARENA + .15, 0.08, 0], [ ARENA - .15, 0.08, 0],
  ];
  const stripColors = [0x0033ff, 0x0033ff, 0x0033ff, 0x0033ff];
  for (let i = 0; i < 4; i++) {
    const pl = new THREE.PointLight(stripColors[i], 3, 18);
    pl.position.set(...stripCfgs[i]); scene.add(pl);
  }

  // Cover boxes layout  [x, z, w, d, h]
  const boxDefs = [
    [ 9,  9, 2.2, 2.2, 2],   [-9,  9, 2.2, 2.2, 2],
    [ 9, -9, 2.2, 2.2, 2],   [-9, -9, 2.2, 2.2, 2],
    [ 0, 13, 5,   2,   2],   [ 0,-13, 5,   2,   2],
    [13,  0, 2,   5,   2],   [-13,  0, 2,  5,   2],
    [ 5,  0, 2,   2, 1.4],   [-5,  0, 2,  2,  1.4],
    [ 0,  5, 2,   2, 1.4],   [ 0, -5, 2,  2,  1.4],
    [16, 16, 1.5, 1.5, 2.5], [-16, 16, 1.5, 1.5, 2.5],
    [16,-16, 1.5, 1.5, 2.5], [-16,-16, 1.5, 1.5, 2.5],
  ];

  for (const [x, z, w, d, h] of boxDefs) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = (h > 1.8) ? matBox : matBoxAcct;
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, h/2, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    scene.add(mesh);
    obstacles.push({
      min: new THREE.Vector3(x - w/2, 0,   z - d/2),
      max: new THREE.Vector3(x + w/2, h,   z + d/2),
    });
  }

  // Lighting
  scene.add(new THREE.AmbientLight(0x112244, 2.0));
  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(4, 10, 6); sun.castShadow = true;
  sun.shadow.camera.left = -28; sun.shadow.camera.right = 28;
  sun.shadow.camera.top  =  28; sun.shadow.camera.bottom = -28;
  sun.shadow.mapSize.setScalar(1024);
  scene.add(sun);

  // Corner ceiling lights
  for (const [cx, cz] of [[-18,-18],[18,-18],[-18,18],[18,18]]) {
    const pl = new THREE.PointLight(0x3355ff, 2, 30);
    pl.position.set(cx, WALL_H - .5, cz); scene.add(pl);
  }
}

// ===================================================================
//  GUN MODEL (camera-space)
// ===================================================================
let gunGroup, gunBaseY = -.22, gunRecoilY = 0;

function buildGun() {
  gunGroup = new THREE.Group();
  const dark = new THREE.MeshLambertMaterial({ color: 0x222230 });
  const mid  = new THREE.MeshLambertMaterial({ color: 0x3a3a55 });
  const acc  = new THREE.MeshLambertMaterial({ color: 0x556688 });

  // Receiver
  const recv = new THREE.Mesh(new THREE.BoxGeometry(.085, .10, .30), dark);
  recv.position.set(0, 0, -.15); gunGroup.add(recv);

  // Barrel
  const brl = new THREE.Mesh(new THREE.BoxGeometry(.038, .038, .28), mid);
  brl.position.set(0, .03, -.38); gunGroup.add(brl);

  // Front sight
  const sight = new THREE.Mesh(new THREE.BoxGeometry(.01, .04, .01), acc);
  sight.position.set(0, .055, -.48); gunGroup.add(sight);

  // Grip
  const grip = new THREE.Mesh(new THREE.BoxGeometry(.06, .16, .08), dark);
  grip.position.set(0, -.12, -.04); grip.rotation.x = .18; gunGroup.add(grip);

  // Magazine
  const mag = new THREE.Mesh(new THREE.BoxGeometry(.05, .11, .055), mid);
  mag.position.set(0, -.09, -.13); gunGroup.add(mag);

  // Muzzle flash plane
  const flash = new THREE.Mesh(
    new THREE.PlaneGeometry(.22, .22),
    new THREE.MeshBasicMaterial({ color: 0xffee88, side: THREE.DoubleSide, transparent:true, depthTest:false })
  );
  flash.position.set(0, .03, -.53);
  flash.name = 'muzzleFlash'; flash.visible = false;
  gunGroup.add(flash);

  gunGroup.position.set(.24, gunBaseY, -.38);
  gunGroup.rotation.y = -.04;
  camera.add(gunGroup);
}

let muzzleTimer = 0;
function showMuzzleFlash() {
  const f = gunGroup.getObjectByName('muzzleFlash');
  if (f) { f.visible = true; f.rotation.z = Math.random() * Math.PI; }
  muzzleTimer = .055;
  gunRecoilY = .035;
}

// ===================================================================
//  ENEMY
// ===================================================================
const ENEMY_VARIANTS = [
  { color: 0xcc1100, emissive: 0x440000, light: 0xff2200 }, // red
  { color: 0xcc6600, emissive: 0x331500, light: 0xff8800 }, // orange
  { color: 0x8800cc, emissive: 0x220033, light: 0xcc00ff }, // purple
  { color: 0x006688, emissive: 0x001a22, light: 0x00ccff }, // cyan
];

function spawnEnemy(waveNum) {
  const id = eidCounter++;
  const hp    = 60  + (waveNum - 1) * 25;
  const speed = 2.8 + (waveNum - 1) * .35;
  const dmg   = 10  + (waveNum - 1) * 3;
  const variant = ENEMY_VARIANTS[Math.min(waveNum - 1, ENEMY_VARIANTS.length - 1)];

  // Spawn on the arena perimeter, away from the player
  let spawnPos;
  for (let attempt = 0; attempt < 30; attempt++) {
    const side = Math.floor(Math.random() * 4);
    let x, z;
    if (side === 0) { x = (Math.random()-.5)*(ARENA*2-4); z = -(ARENA-3); }
    else if (side === 1) { x = (Math.random()-.5)*(ARENA*2-4); z =  ARENA-3; }
    else if (side === 2) { x = -(ARENA-3); z = (Math.random()-.5)*(ARENA*2-4); }
    else                 { x =  ARENA-3;  z = (Math.random()-.5)*(ARENA*2-4); }
    const dx = x-player.pos.x, dz = z-player.pos.z;
    if (Math.sqrt(dx*dx+dz*dz) > 10) { spawnPos = new THREE.Vector3(x, 1, z); break; }
  }
  if (!spawnPos) spawnPos = new THREE.Vector3(-ARENA+4, 1, -ARENA+4);

  // Mesh — a humanoid-ish block figure
  const group = new THREE.Group();

  const bodyMat = new THREE.MeshLambertMaterial({ color: variant.color, emissive: variant.emissive });
  const body = new THREE.Mesh(new THREE.BoxGeometry(.7, 1.0, .4), bodyMat);
  body.position.y = .5; body.castShadow = true; group.add(body);

  const head = new THREE.Mesh(new THREE.BoxGeometry(.55, .55, .55), bodyMat);
  head.position.y = 1.3; head.castShadow = true; group.add(head);

  // Eyes
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
  const eyeGeo = new THREE.BoxGeometry(.12, .08, .04);
  const eyeL = new THREE.Mesh(eyeGeo, eyeMat); eyeL.position.set(-.15, 1.35, .28); group.add(eyeL);
  const eyeR = new THREE.Mesh(eyeGeo, eyeMat); eyeR.position.set( .15, 1.35, .28); group.add(eyeR);

  // Legs
  const legGeo = new THREE.BoxGeometry(.25, .55, .25);
  const legL = new THREE.Mesh(legGeo, bodyMat); legL.position.set(-.2, -.1, 0); group.add(legL);
  const legR = new THREE.Mesh(legGeo, bodyMat); legR.position.set( .2, -.1, 0); group.add(legR);

  // Glow light
  const glow = new THREE.PointLight(variant.light, 1.2, 5);
  glow.position.set(0, 1, 0); group.add(glow);

  group.position.copy(spawnPos);
  scene.add(group);

  // HP bar DOM element
  const ebarEl = document.createElement('div');
  ebarEl.className = 'ebar'; ebarEl.id = 'ebar-'+id;
  ebarEl.innerHTML = '<div class="ebar-bg"><div class="ebar-fill" style="width:100%"></div></div>';
  ebarContainer.appendChild(ebarEl);

  const enemy = {
    id, group, glow, hp, maxHp: hp, speed, dmg,
    pos: spawnPos.clone(),
    attackT: 0, stagger: 0,
    dead: false, deathT: 0,
    legPhase: Math.random() * Math.PI * 2,
  };
  enemies.push(enemy);
  return enemy;
}

function updateEnemyHPBar(enemy) {
  const el = document.getElementById('ebar-' + enemy.id);
  if (!el) return;

  if (enemy.dead) { el.style.display = 'none'; return; }

  // Project world position to screen
  const worldPos = new THREE.Vector3(enemy.pos.x, 2.2, enemy.pos.z);
  const ndc = worldPos.clone().project(camera);
  if (ndc.z > 1) { el.style.display = 'none'; return; } // behind camera

  const sx = (ndc.x *  .5 + .5) * innerWidth;
  const sy = (ndc.y * -.5 + .5) * innerHeight;
  el.style.display = 'flex';
  el.style.left = sx + 'px';
  el.style.top  = sy + 'px';

  const fill = el.querySelector('.ebar-fill');
  if (fill) fill.style.width = Math.max(0, (enemy.hp / enemy.maxHp) * 100) + '%';
}

function updateEnemy(enemy, dt) {
  if (enemy.dead) {
    enemy.deathT += dt;
    const s = 1 - enemy.deathT / .5;
    if (s <= 0) {
      scene.remove(enemy.group);
      const el = document.getElementById('ebar-' + enemy.id);
      if (el) el.remove();
      return true; // mark for removal
    }
    enemy.group.scale.setScalar(s);
    enemy.group.position.y = s * .5;
    return false;
  }

  if (enemy.stagger > 0) enemy.stagger -= dt;

  const dx = player.pos.x - enemy.pos.x;
  const dz = player.pos.z - enemy.pos.z;
  const dist = Math.sqrt(dx*dx + dz*dz);

  // Face player
  enemy.group.rotation.y = Math.atan2(dx, dz);

  // Leg animation
  if (dist > 1.5 && enemy.stagger <= 0) {
    enemy.legPhase += dt * enemy.speed * 4;
    const legSwing = Math.sin(enemy.legPhase) * .25;
    const legs = [enemy.group.children[4], enemy.group.children[5]];
    if (legs[0]) legs[0].rotation.x =  legSwing;
    if (legs[1]) legs[1].rotation.x = -legSwing;
  }

  // Move toward player
  if (dist > 1.1 && enemy.stagger <= 0) {
    const nx = dx/dist, nz = dz/dist;
    let nx2 = enemy.pos.x + nx * enemy.speed * dt;
    let nz2 = enemy.pos.z + nz * enemy.speed * dt;

    // Arena boundary
    nx2 = Math.max(-ARENA+1, Math.min(ARENA-1, nx2));
    nz2 = Math.max(-ARENA+1, Math.min(ARENA-1, nz2));

    // Obstacle avoidance (simple push-aside)
    for (const obs of obstacles) {
      if (nx2+.5 > obs.min.x && nx2-.5 < obs.max.x &&
          nz2+.5 > obs.min.z && nz2-.5 < obs.max.z) {
        if (Math.abs(nx) > Math.abs(nz)) nz2 = enemy.pos.z + nz * enemy.speed * dt * 2;
        else                              nx2 = enemy.pos.x + nx * enemy.speed * dt * 2;
        nx2 = Math.max(-ARENA+1, Math.min(ARENA-1, nx2));
        nz2 = Math.max(-ARENA+1, Math.min(ARENA-1, nz2));
        break;
      }
    }

    enemy.pos.x = nx2;
    enemy.pos.z = nz2;
  }

  // Attack player
  if (dist < 1.4) {
    enemy.attackT -= dt;
    if (enemy.attackT <= 0) {
      enemy.attackT = 1.4;
      hurtPlayer(enemy.dmg);
    }
  }

  enemy.group.position.set(enemy.pos.x, 0, enemy.pos.z);
  updateEnemyHPBar(enemy);
  return false;
}

function killEnemy(enemy) {
  enemy.dead = true;
  kills++;
  const pts = 100 * wave;
  score += pts;
  beep('kill');
  spawnBurst(new THREE.Vector3(enemy.pos.x, 1, enemy.pos.z), 16, 0xff3300);
  addKillFeed('+' + pts + ' pts');
  refreshScoreHUD();

  const alive = enemies.filter(e => !e.dead).length;
  if (alive === 0 && !waveTransition) triggerWaveTransition();
}

// ===================================================================
//  SHOOTING
// ===================================================================
const raycaster = new THREE.Raycaster();
let xhairFlash = 0;

function shoot() {
  if (player.reloading) return;
  if (player.ammo <= 0) { beep('empty'); startReload(); return; }
  if (player.shootT > 0) return;

  player.ammo--;
  player.shootT = FIRE_RATE;
  beep('shoot');
  showMuzzleFlash();
  refreshAmmoHUD();

  // Slight pitch recoil
  pitch += .018 + Math.random() * .008;
  pitch = Math.min(pitch, Math.PI / 2.5);

  // Raycast from screen center
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const meshes = enemies.filter(e => !e.dead).map(e => e.group);
  const hits   = raycaster.intersectObjects(meshes, true);

  if (hits.length > 0) {
    let hitGroup = hits[0].object;
    while (hitGroup.parent && !(hitGroup.parent instanceof THREE.Scene)) hitGroup = hitGroup.parent;
    const enemy = enemies.find(e => e.group === hitGroup);
    if (enemy && !enemy.dead) {
      enemy.hp     -= GUN_DMG;
      enemy.stagger = .18;
      beep('hit');
      spawnBurst(hits[0].point, 6, 0xff6600);
      flashXhair();
      if (enemy.hp <= 0) killEnemy(enemy);
    }
  }

  // Bullet tracer
  const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
  spawnTracer(camera.position.clone().addScaledVector(dir, .8), dir);

  if (player.ammo === 0 && !player.reloading) startReload();
}

function flashXhair() {
  document.getElementById('xhair').classList.add('hit');
  xhairFlash = .15;
}

function startReload() {
  if (player.reloading || player.reserve <= 0 || player.ammo === MAX_CLIP) return;
  player.reloading = true;
  player.reloadT   = RELOAD_T;
  beep('reload');
  document.getElementById('reload-msg').style.display = 'block';
}

function finishReload() {
  const need = MAX_CLIP - player.ammo;
  const take = Math.min(need, player.reserve);
  player.ammo    += take;
  player.reserve -= take;
  player.reloading = false;
  document.getElementById('reload-msg').style.display = 'none';
  refreshAmmoHUD();
}

// ===================================================================
//  PARTICLES / TRACERS
// ===================================================================
function spawnBurst(origin, count, color) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true });
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.06), mat.clone());
    mesh.position.copy(origin); scene.add(mesh);
    const vel = new THREE.Vector3((Math.random()-.5)*9, Math.random()*8, (Math.random()-.5)*9);
    particles.push({ mesh, vel, life: .4 + Math.random()*.2 });
  }
}

function spawnTracer(origin, dir) {
  const pts = [origin.clone(), origin.clone().addScaledVector(dir, 18)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineBasicMaterial({ color: 0xffee66, transparent: true, opacity: .85 });
  const line = new THREE.Line(geo, mat); scene.add(line);
  tracers.push({ line, life: .06 });
}

// ===================================================================
//  PLAYER DAMAGE
// ===================================================================
function hurtPlayer(amount) {
  if (player.hp <= 0) return;
  player.hp = Math.max(0, player.hp - amount);
  refreshHealthHUD();
  beep('hurt');

  // Red vignette flash
  const flash = document.getElementById('hit-flash');
  flash.style.background = `rgba(255,0,0,${.25 + (1-player.hp/100)*.25})`;
  setTimeout(() => { flash.style.background = 'rgba(255,0,0,0)'; }, 220);

  // Camera shake
  pitch += (Math.random()-.5) * .04;
  yaw   += (Math.random()-.5) * .04;

  if (player.hp <= 0) triggerGameOver();
}

// ===================================================================
//  WAVE SYSTEM
// ===================================================================
function launchWave(num) {
  wave = num;
  waveTransition = false;
  const count = 5 + (num - 1) * 3;
  enemies.length = 0;
  ebarContainer.innerHTML = '';
  for (let i = 0; i < count; i++) {
    setTimeout(() => { if (gState === 'playing') spawnEnemy(num); }, i * 450 + 100);
  }
  refreshWaveHUD();
  announceWave('WAVE ' + num);
  beep('wave');
}

function triggerWaveTransition() {
  waveTransition = true;
  waveTimer = 3.5;
  announceWave('WAVE ' + wave + ' CLEAR!');
  beep('wave');
}

function announceWave(txt) {
  const el = document.getElementById('wave-ann');
  el.textContent = txt; el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2800);
}

function addKillFeed(txt) {
  const kf = document.getElementById('killfeed');
  const msg = document.createElement('div');
  msg.className = 'kf-msg'; msg.textContent = txt;
  kf.appendChild(msg);
  setTimeout(() => msg.remove(), 2200);
}

// ===================================================================
//  HUD REFRESH
// ===================================================================
function refreshHealthHUD() {
  const pct = Math.max(0, player.hp);
  document.getElementById('hp-fill').style.width = pct + '%';
  const r = Math.round(255 * (1 - pct/100));
  const g = Math.round(255 * (pct/100));
  document.getElementById('hp-fill').style.background = `rgb(${r},${g},0)`;
  document.getElementById('hp-text').textContent = Math.ceil(player.hp);
}
function refreshAmmoHUD() {
  document.getElementById('ammo-cur').textContent = player.ammo;
  document.getElementById('ammo-res').textContent = player.reserve;
}
function refreshScoreHUD() {
  document.getElementById('score-val').textContent = score;
}
function refreshWaveHUD() {
  document.getElementById('wave-val').textContent = wave;
}

// ===================================================================
//  GAME STATE MANAGEMENT
// ===================================================================
function startGame() {
  // Reset player
  player.pos.set(0, PLR_H, 0);
  player.vel.set(0,0,0);
  player.hp      = 100;
  player.ammo    = MAX_CLIP;
  player.reserve = RESERVE;
  player.reloading = false;
  player.shootT  = 0;
  yaw = 0; pitch = 0;

  // Reset game counters
  score = 0; wave = 1; kills = 0;
  waveTransition = false; waveTimer = 0;

  // Clear scene objects from prior run
  for (const e of enemies) scene.remove(e.group);
  enemies.length = 0;
  ebarContainer.innerHTML = '';
  for (const p of particles) scene.remove(p.mesh);
  particles.length = 0;
  for (const t of tracers) scene.remove(t.line);
  tracers.length = 0;

  // UI
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('go-screen').style.display    = 'none';
  document.getElementById('hud').style.display          = 'block';
  document.getElementById('reload-msg').style.display   = 'none';

  refreshHealthHUD(); refreshAmmoHUD(); refreshScoreHUD(); refreshWaveHUD();

  gState = 'playing';
  launchWave(1);
}

function triggerGameOver() {
  gState = 'dead';
  document.getElementById('hud').style.display       = 'none';
  document.getElementById('go-screen').style.display = 'flex';
  document.getElementById('go-stats').innerHTML =
    `Score: <b>${score}</b><br>Wave reached: <b>${wave}</b><br>Enemies killed: <b>${kills}</b>`;
  if (document.pointerLockElement) document.exitPointerLock();
}

// ===================================================================
//  PLAYER UPDATE
// ===================================================================
function updatePlayer(dt) {
  // Sync camera orientation
  camera.rotation.order = 'YXZ';
  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  // Movement vectors (horizontal only)
  const fwd   = new THREE.Vector3( Math.sin(yaw), 0, -Math.cos(yaw));
  const right = new THREE.Vector3( Math.cos(yaw), 0,  Math.sin(yaw));
  const move  = new THREE.Vector3();

  if (keys.has('KeyW') || keys.has('ArrowUp'))    move.addScaledVector(fwd,   1);
  if (keys.has('KeyS') || keys.has('ArrowDown'))  move.addScaledVector(fwd,  -1);
  if (keys.has('KeyA') || keys.has('ArrowLeft'))  move.addScaledVector(right,-1);
  if (keys.has('KeyD') || keys.has('ArrowRight')) move.addScaledVector(right, 1);

  const sprinting = keys.has('ShiftLeft') || keys.has('ShiftRight');
  const spd = SPEED * (sprinting ? SPRINT : 1);
  if (move.length() > 0) move.normalize().multiplyScalar(spd);

  player.vel.x = move.x;
  player.vel.z = move.z;

  // Gravity
  if (!player.onGround) player.vel.y += GRAVITY * dt;

  // Jump
  if (keys.has('Space') && player.onGround) {
    player.vel.y  = JUMP_V;
    player.onGround = false;
  }

  // Integrate
  player.pos.x += player.vel.x * dt;
  player.pos.y += player.vel.y * dt;
  player.pos.z += player.vel.z * dt;

  // Floor
  if (player.pos.y <= PLR_H) {
    player.pos.y  = PLR_H;
    player.vel.y  = 0;
    player.onGround = true;
  } else {
    player.onGround = false;
  }

  // Arena walls
  player.pos.x = Math.max(-ARENA + PLR_R, Math.min(ARENA - PLR_R, player.pos.x));
  player.pos.z = Math.max(-ARENA + PLR_R, Math.min(ARENA - PLR_R, player.pos.z));

  // Obstacle AABB
  for (const obs of obstacles) {
    if (player.pos.x + PLR_R > obs.min.x && player.pos.x - PLR_R < obs.max.x &&
        player.pos.z + PLR_R > obs.min.z && player.pos.z - PLR_R < obs.max.z &&
        player.pos.y < obs.max.y + .1) {

      const oL  = player.pos.x + PLR_R - obs.min.x;
      const oR  = obs.max.x - (player.pos.x - PLR_R);
      const oFr = player.pos.z + PLR_R - obs.min.z;
      const oBk = obs.max.z - (player.pos.z - PLR_R);
      const mn  = Math.min(oL, oR, oFr, oBk);

      if      (mn === oL)  player.pos.x = obs.min.x - PLR_R;
      else if (mn === oR)  player.pos.x = obs.max.x + PLR_R;
      else if (mn === oFr) player.pos.z = obs.min.z - PLR_R;
      else                 player.pos.z = obs.max.z + PLR_R;
    }
  }

  // Camera bob
  const horizSpd = Math.sqrt(player.vel.x**2 + player.vel.z**2);
  if (player.onGround && horizSpd > .5) {
    camBobT += dt * horizSpd * .55;
    camera.position.y = player.pos.y + Math.sin(camBobT * 2) * .04;
  } else {
    camera.position.y = player.pos.y;
  }
  camera.position.x = player.pos.x;
  camera.position.z = player.pos.z;

  // Timers
  if (player.shootT > 0) player.shootT -= dt;
  if (shooting && player.shootT <= 0 && !player.reloading) shoot();

  if (player.reloading) {
    player.reloadT -= dt;
    if (player.reloadT <= 0) finishReload();
  }

  // Gun recoil spring
  gunRecoilY += (-gunRecoilY) * Math.min(1, dt * 18);
  if (gunGroup) gunGroup.position.y = gunBaseY + gunRecoilY;
}

// ===================================================================
//  MAIN LOOP
// ===================================================================
let lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = Math.min((ts - lastT) / 1000, .05);
  lastT = ts;

  if (gState === 'playing') {
    updatePlayer(dt);

    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
      if (updateEnemy(enemies[i], dt)) enemies.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      p.mesh.position.addScaledVector(p.vel, dt);
      p.vel.y -= 14 * dt;
      p.mesh.material.opacity = Math.max(0, p.life / .4);
      if (p.life <= 0) { scene.remove(p.mesh); particles.splice(i, 1); }
    }

    // Tracers
    for (let i = tracers.length - 1; i >= 0; i--) {
      const tr = tracers[i];
      tr.life -= dt;
      tr.line.material.opacity = Math.max(0, tr.life / .06);
      if (tr.life <= 0) { scene.remove(tr.line); tracers.splice(i, 1); }
    }

    // Muzzle flash
    if (muzzleTimer > 0) {
      muzzleTimer -= dt;
      if (muzzleTimer <= 0) {
        const f = gunGroup && gunGroup.getObjectByName('muzzleFlash');
        if (f) f.visible = false;
      }
    }

    // Crosshair reset
    if (xhairFlash > 0) {
      xhairFlash -= dt;
      if (xhairFlash <= 0) document.getElementById('xhair').classList.remove('hit');
    }

    // Wave transition countdown
    if (waveTransition) {
      waveTimer -= dt;
      if (waveTimer <= 0) launchWave(wave + 1);
    }
  }

  renderer.render(scene, camera);
}

// ===================================================================
//  INPUT
// ===================================================================
function setupInput() {
  document.addEventListener('keydown', e => {
    keys.add(e.code);
    if (e.code === 'KeyR' && gState === 'playing') startReload();
  });
  document.addEventListener('keyup', e => keys.delete(e.code));

  document.addEventListener('mousedown', e => {
    if (e.button === 0 && locked && gState === 'playing') { shooting = true; shoot(); }
  });
  document.addEventListener('mouseup', e => { if (e.button === 0) shooting = false; });

  document.addEventListener('mousemove', e => {
    if (!locked) return;
    yaw   -= e.movementX * .0018;
    pitch -= e.movementY * .0018;
    pitch  = Math.max(-Math.PI/2.3, Math.min(Math.PI/2.3, pitch));
  });

  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement !== null;
  });

  window.addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // Prevent context menu on right-click
  document.addEventListener('contextmenu', e => e.preventDefault());
}

function requestLock() {
  document.body.requestPointerLock();
}

document.getElementById('start-btn').addEventListener('click', () => {
  requestLock();
  // pointerlockchange may fire after a slight delay; start game once locked
  const waitForLock = setInterval(() => {
    if (document.pointerLockElement) {
      clearInterval(waitForLock);
      startGame();
    }
  }, 50);
});

document.getElementById('replay-btn').addEventListener('click', () => {
  requestLock();
  const waitForLock = setInterval(() => {
    if (document.pointerLockElement) {
      clearInterval(waitForLock);
      startGame();
    }
  }, 50);
});

// ===================================================================
//  INIT
// ===================================================================
buildWorld();
buildGun();
setupInput();
requestAnimationFrame(loop);
</script>
</body>
