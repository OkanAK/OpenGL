<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Snake</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      padding: env(safe-area-inset-top, 12px) 12px env(safe-area-inset-bottom, 12px);
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #4ade80;
      text-shadow: 0 0 20px #4ade8066;
    }

    .scores {
      display: flex;
      gap: 16px;
      font-size: 0.85rem;
      text-align: right;
    }

    .score-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label { color: #64748b; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .score-value { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }

    #canvas-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    canvas {
      border-radius: 12px;
      box-shadow: 0 0 40px #4ade8022, 0 0 0 2px #1e293b;
      display: block;
      background: #111827;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172acc;
      border-radius: 12px;
      gap: 12px;
      backdrop-filter: blur(4px);
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 24px #4ade8066;
    }

    #overlay p { color: #94a3b8; font-size: 0.9rem; }

    #start-btn {
      margin-top: 8px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: #4ade80;
      color: #0f172a;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
      box-shadow: 0 0 20px #4ade8066;
    }

    #start-btn:active { transform: scale(0.95); }

    /* D-pad */
    #dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: min(52vw, 200px);
      padding-bottom: 4px;
    }

    .dpad-btn {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 10px;
      background: #1e293b;
      color: #4ade80;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.08s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .dpad-btn:active { background: #334155; transform: scale(0.9); }
    .dpad-btn[data-dir="up"]    { grid-area: up; }
    .dpad-btn[data-dir="left"]  { grid-area: left; }
    .dpad-btn[data-dir="right"] { grid-area: right; }
    .dpad-btn[data-dir="down"]  { grid-area: down; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>SNAKE</h1>
    <div class="scores">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-value" id="best">0</span>
      </div>
    </div>
  </header>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Swipe or use the D-pad to move</p>
      <button id="start-btn">PLAY</button>
    </div>
  </div>

  <div id="dpad">
    <button class="dpad-btn" data-dir="up">▲</button>
    <button class="dpad-btn" data-dir="left">◀</button>
    <button class="dpad-btn" data-dir="right">▶</button>
    <button class="dpad-btn" data-dir="down">▼</button>
  </div>
</div>

<script>
(() => {
  const GRID = 20;
  const TICK_BASE = 150; // ms per move
  const TICK_MIN  = 60;

  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const scoreEl = document.getElementById('score');
  const bestEl  = document.getElementById('best');
  const titleEl = document.getElementById('overlay-title');
  const msgEl   = document.getElementById('overlay-msg');
  const btn     = document.getElementById('start-btn');

  let cols, rows, cellSize;
  let snake, dir, nextDir, food, score, best, running, animId, lastTick;

  // ── sizing ──────────────────────────────────────────────────────────────────
  function resize() {
    const wrap = document.getElementById('canvas-wrap');
    const dpad = document.getElementById('dpad');
    const header = document.querySelector('header');
    const safeTop = parseInt(getComputedStyle(document.documentElement)
      .getPropertyValue('--sat') || '0');

    const availH = wrap.clientHeight;
    const availW = wrap.clientWidth;
    const size   = Math.min(availW, availH);

    cellSize = Math.floor(size / GRID);
    cols = Math.floor(availW / cellSize);
    rows = Math.floor(availH / cellSize);

    canvas.width  = cols * cellSize;
    canvas.height = rows * cellSize;

    if (running) draw();
  }

  // ── game init ───────────────────────────────────────────────────────────────
  function initGame() {
    const mid = { x: Math.floor(cols / 2), y: Math.floor(rows / 2) };
    snake   = [mid, { x: mid.x - 1, y: mid.y }, { x: mid.x - 2, y: mid.y }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    scoreEl.textContent = 0;
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => `${s.x},${s.y}`));
    let f;
    do {
      f = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
    } while (occupied.has(`${f.x},${f.y}`));
    food = f;
  }

  // ── game loop ────────────────────────────────────────────────────────────────
  function tick(ts) {
    if (!running) return;
    animId = requestAnimationFrame(tick);

    const speed = Math.max(TICK_MIN, TICK_BASE - score * 3);
    if (ts - lastTick < speed) return;
    lastTick = ts;

    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    // wall collision
    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
      return gameOver();
    }
    // self collision
    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake_best', best);
      }
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // grid dots
    ctx.fillStyle = '#1e293b';
    for (let x = 0; x < cols; x++) {
      for (let y = 0; y < rows; y++) {
        ctx.fillRect(x * cellSize + cellSize/2 - 1, y * cellSize + cellSize/2 - 1, 2, 2);
      }
    }

    // food – pulsing glow
    const t = Date.now() / 600;
    const pulse = 0.6 + 0.4 * Math.sin(t * Math.PI * 2);
    const fx = food.x * cellSize, fy = food.y * cellSize, fc = cellSize;
    ctx.save();
    ctx.shadowBlur = 16 * pulse;
    ctx.shadowColor = '#f87171';
    ctx.fillStyle = '#f87171';
    const r = cellSize * 0.35;
    roundRect(ctx, fx + fc/2 - r, fy + fc/2 - r, r * 2, r * 2, r * 0.5);
    ctx.fill();
    ctx.restore();

    // snake
    snake.forEach((seg, i) => {
      const progress = 1 - i / snake.length;
      const alpha = 0.4 + 0.6 * progress;
      const padding = i === 0 ? 1 : 2;
      const sx = seg.x * cellSize + padding;
      const sy = seg.y * cellSize + padding;
      const sw = cellSize - padding * 2;

      ctx.save();
      if (i === 0) {
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#4ade80';
      }
      ctx.globalAlpha = alpha;
      ctx.fillStyle = i === 0 ? '#4ade80' : `hsl(${142 - i * 1.5}, 70%, ${45 + progress * 15}%)`;
      roundRect(ctx, sx, sy, sw, sw, cellSize * 0.25);
      ctx.fill();
      ctx.restore();

      // eyes on head
      if (i === 0) {
        ctx.save();
        ctx.fillStyle = '#0f172a';
        const ew = Math.max(2, cellSize * 0.1);
        const eyeOffsets = eyePositions(dir, cellSize);
        eyeOffsets.forEach(([ex, ey]) => {
          ctx.beginPath();
          ctx.arc(seg.x * cellSize + ex, seg.y * cellSize + ey, ew, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    });
  }

  function eyePositions(d, c) {
    const m = c * 0.28, o = c * 0.22;
    if (d.x === 1)  return [[c - m, o],     [c - m, c - o]];
    if (d.x === -1) return [[m,     o],     [m,     c - o]];
    if (d.y === -1) return [[o,     m],     [c - o, m    ]];
                    return [[o,     c - m], [c - o, c - m]];
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    titleEl.textContent = 'GAME OVER';
    msgEl.textContent   = `Score: ${score}`;
    btn.textContent     = 'PLAY AGAIN';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    overlay.classList.add('hidden');
    running = true;
    lastTick = 0;
    resize();
    initGame();
    animId = requestAnimationFrame(tick);
  }

  // ── input ────────────────────────────────────────────────────────────────────
  const DIRS = {
    ArrowUp:    { x: 0, y: -1 }, w: { x: 0, y: -1 },
    ArrowDown:  { x: 0, y:  1 }, s: { x: 0, y:  1 },
    ArrowLeft:  { x: -1, y: 0 }, a: { x: -1, y: 0 },
    ArrowRight: { x:  1, y: 0 }, d: { x:  1, y: 0 },
  };

  document.addEventListener('keydown', e => {
    const d = DIRS[e.key];
    if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    if (e.key === ' ' && !running) startGame();
  });

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const map = { up: { x:0,y:-1 }, down: { x:0,y:1 }, left: { x:-1,y:0 }, right: { x:1,y:0 } };
    const handler = e => {
      e.preventDefault();
      const d = map[btn.dataset.dir];
      if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
    };
    btn.addEventListener('touchstart', handler, { passive: false });
    btn.addEventListener('mousedown',  handler);
  });

  // swipe
  let touchStart = null;
  document.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  document.addEventListener('touchend', e => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    touchStart = null;

    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    let d;
    if (Math.abs(dx) > Math.abs(dy)) {
      d = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    } else {
      d = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
    }
    if (!(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }, { passive: true });

  btn.addEventListener('click', startGame);
  btn.addEventListener('touchend', e => { e.preventDefault(); startGame(); });

  // ── boot ─────────────────────────────────────────────────────────────────────
  best = parseInt(localStorage.getItem('snake_best') || '0');
  bestEl.textContent = best;

  window.addEventListener('resize', resize);
  resize();
})();
</script>
</body>
</html>
