<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Snake</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: #0f172a;
      color: #e2e8f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100dvh;
      padding: 8px 12px;
      gap: 8px;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      color: #4ade80;
      text-shadow: 0 0 20px #4ade8066;
    }

    .scores { display: flex; gap: 16px; }
    .score-box { display: flex; flex-direction: column; align-items: center; }
    .score-label { color: #64748b; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .score-value { font-size: 1.2rem; font-weight: 700; color: #e2e8f0; }

    #canvas-wrap {
      position: relative;
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    canvas {
      border-radius: 12px;
      box-shadow: 0 0 40px #4ade8022, 0 0 0 2px #1e293b;
      display: block;
      background: #111827;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172acc;
      border-radius: 12px;
      gap: 12px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #4ade80;
      text-shadow: 0 0 24px #4ade8066;
    }

    #overlay p { color: #94a3b8; font-size: 0.9rem; text-align: center; }

    #start-btn {
      margin-top: 8px;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      background: #4ade80;
      color: #0f172a;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 0 20px #4ade8066;
    }

    #dpad {
      flex-shrink: 0;
      display: grid;
      grid-template-areas: ". up ." "left . right" ". down .";
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      width: min(52vw, 180px);
      padding-bottom: 4px;
    }

    .dpad-btn {
      width: 100%;
      aspect-ratio: 1;
      border: none;
      border-radius: 10px;
      background: #1e293b;
      color: #4ade80;
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active { background: #334155; }
    .dpad-btn[data-dir="up"]    { grid-area: up; }
    .dpad-btn[data-dir="left"]  { grid-area: left; }
    .dpad-btn[data-dir="right"] { grid-area: right; }
    .dpad-btn[data-dir="down"]  { grid-area: down; }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>SNAKE</h1>
    <div class="scores">
      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-value" id="best">0</span>
      </div>
    </div>
  </header>

  <div id="canvas-wrap">
    <canvas id="canvas"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">SNAKE</h2>
      <p id="overlay-msg">Swipe or tap the arrows to move</p>
      <button id="start-btn">PLAY</button>
    </div>
  </div>

  <div id="dpad">
    <button class="dpad-btn" data-dir="up">▲</button>
    <button class="dpad-btn" data-dir="left">◀</button>
    <button class="dpad-btn" data-dir="right">▶</button>
    <button class="dpad-btn" data-dir="down">▼</button>
  </div>
</div>

<script>
(() => {
  const GRID = 20;
  const TICK_BASE = 160;
  const TICK_MIN  = 65;

  const canvas   = document.getElementById('canvas');
  const ctx      = canvas.getContext('2d');
  const overlay  = document.getElementById('overlay');
  const scoreEl  = document.getElementById('score');
  const bestEl   = document.getElementById('best');
  const titleEl  = document.getElementById('overlay-title');
  const msgEl    = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');

  let cols, rows, cellSize;
  let snake, food, score, best, running, animId, lastTick;
  let dir     = { x: 1, y: 0 };
  let nextDir = { x: 1, y: 0 };

  // ── sizing ──────────────────────────────────────────────────────────────────
  function resize() {
    const wrap = document.getElementById('canvas-wrap');
    const W = wrap.clientWidth;
    const H = wrap.clientHeight;

    cellSize = Math.max(1, Math.floor(Math.min(W, H) / GRID));
    cols = Math.max(1, Math.floor(W / cellSize));
    rows = Math.max(1, Math.floor(H / cellSize));

    canvas.width  = cols * cellSize;
    canvas.height = rows * cellSize;

    canvas.style.width  = canvas.width  + 'px';
    canvas.style.height = canvas.height + 'px';

    if (running && food) draw();
  }

  // ── game init ───────────────────────────────────────────────────────────────
  function initGame() {
    const mx = Math.floor(cols / 2);
    const my = Math.floor(rows / 2);
    snake   = [{ x: mx, y: my }, { x: mx - 1, y: my }, { x: mx - 2, y: my }];
    dir     = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score   = 0;
    scoreEl.textContent = 0;
    spawnFood();
  }

  function spawnFood() {
    const occupied = new Set(snake.map(s => s.x + ',' + s.y));
    let f;
    do {
      f = { x: Math.floor(Math.random() * cols), y: Math.floor(Math.random() * rows) };
    } while (occupied.has(f.x + ',' + f.y));
    food = f;
  }

  // ── game loop ────────────────────────────────────────────────────────────────
  function tick(ts) {
    if (!running) return;
    animId = requestAnimationFrame(tick);

    const speed = Math.max(TICK_MIN, TICK_BASE - score * 3);
    if (ts - lastTick < speed) return;
    lastTick = ts;

    dir = { ...nextDir };
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) return gameOver();
    if (snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('snake_best', best);
      }
      spawnFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const c = cellSize;

    // grid dots
    ctx.fillStyle = '#1e293b';
    for (let x = 0; x < cols; x++) {
      for (let y = 0; y < rows; y++) {
        ctx.fillRect(x * c + c / 2 - 1, y * c + c / 2 - 1, 2, 2);
      }
    }

    // food
    if (food) {
      const t = Date.now() / 600;
      const pulse = 0.6 + 0.4 * Math.sin(t * Math.PI * 2);
      ctx.save();
      ctx.shadowBlur  = 16 * pulse;
      ctx.shadowColor = '#f87171';
      ctx.fillStyle   = '#f87171';
      const r = c * 0.35;
      roundRect(ctx, food.x * c + c / 2 - r, food.y * c + c / 2 - r, r * 2, r * 2, r * 0.5);
      ctx.fill();
      ctx.restore();
    }

    // snake
    snake.forEach((seg, i) => {
      const progress = 1 - i / snake.length;
      const pad = i === 0 ? 1 : 2;
      ctx.save();
      if (i === 0) { ctx.shadowBlur = 14; ctx.shadowColor = '#4ade80'; }
      ctx.globalAlpha = 0.4 + 0.6 * progress;
      ctx.fillStyle = i === 0
        ? '#4ade80'
        : 'hsl(' + (142 - i * 1.5) + ',70%,' + (45 + progress * 15) + '%)';
      roundRect(ctx, seg.x * c + pad, seg.y * c + pad, c - pad * 2, c - pad * 2, c * 0.25);
      ctx.fill();
      ctx.restore();

      // eyes on head
      if (i === 0) {
        ctx.save();
        ctx.fillStyle = '#0f172a';
        const ew = Math.max(2, c * 0.1);
        eyePositions(dir, c).forEach(([ex, ey]) => {
          ctx.beginPath();
          ctx.arc(seg.x * c + ex, seg.y * c + ey, ew, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      }
    });
  }

  function eyePositions(d, c) {
    const m = c * 0.28, o = c * 0.22;
    if (d.x ===  1) return [[c - m, o],     [c - m, c - o]];
    if (d.x === -1) return [[m,     o],     [m,     c - o]];
    if (d.y === -1) return [[o,     m],     [c - o, m    ]];
                    return [[o,     c - m], [c - o, c - m]];
  }

  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function gameOver() {
    running = false;
    cancelAnimationFrame(animId);
    titleEl.textContent = 'GAME OVER';
    msgEl.textContent   = 'Score: ' + score;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    if (running) return;
    overlay.classList.add('hidden');
    resize();
    initGame();
    running  = true;
    lastTick = 0;
    animId   = requestAnimationFrame(tick);
  }

  // ── input ────────────────────────────────────────────────────────────────────
  function tryDir(d) {
    if (d && !(d.x === -dir.x && d.y === -dir.y)) nextDir = d;
  }

  const KEY_MAP = {
    ArrowUp: { x:0,y:-1 }, ArrowDown: { x:0,y:1 },
    ArrowLeft: { x:-1,y:0 }, ArrowRight: { x:1,y:0 },
    w: { x:0,y:-1 }, s: { x:0,y:1 }, a: { x:-1,y:0 }, d: { x:1,y:0 }
  };
  document.addEventListener('keydown', e => {
    if (KEY_MAP[e.key]) { e.preventDefault(); tryDir(KEY_MAP[e.key]); }
    if (e.key === ' ' && !running) startGame();
  });

  const DPAD_MAP = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
  document.querySelectorAll('.dpad-btn').forEach(el => {
    el.addEventListener('touchstart', e => {
      e.preventDefault();
      tryDir(DPAD_MAP[el.dataset.dir]);
    }, { passive: false });
  });

  // swipe
  let swipeStart = null;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    swipeStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', e => {
    if (!swipeStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - swipeStart.x;
    const dy = t.clientY - swipeStart.y;
    swipeStart = null;
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      tryDir(dx > 0 ? { x:1,y:0 } : { x:-1,y:0 });
    } else {
      tryDir(dy > 0 ? { x:0,y:1 } : { x:0,y:-1 });
    }
  }, { passive: true });

  startBtn.addEventListener('click', startGame);

  // ── boot ─────────────────────────────────────────────────────────────────────
  best = parseInt(localStorage.getItem('snake_best') || '0');
  bestEl.textContent = best;
  window.addEventListener('resize', () => { if (!running) resize(); });
  resize();
})();
</script>
</body>
</html>
