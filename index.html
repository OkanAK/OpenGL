<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZOMBIE ARENA</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; font-family:'Courier New',monospace; }
canvas { display:block; }

/* ---- Screens ---- */
.screen {
  position:fixed; inset:0;
  background:rgba(0,0,10,0.93);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  color:#fff; z-index:100;
}
.screen h1 {
  font-size:clamp(30px,7vw,54px); letter-spacing:clamp(3px,2vw,9px);
  color:#44ff44; margin-bottom:6px;
  text-shadow:0 0 40px rgba(60,255,60,.7), 0 0 80px rgba(60,255,60,.3);
}
.screen .sub { color:#666; font-size:12px; letter-spacing:3px; margin-bottom:28px; }
.ctrl-grid { display:grid; grid-template-columns:auto auto; gap:8px 40px; margin-bottom:28px; font-size:13px; }
.k { color:#44ff44; font-weight:bold; text-align:right; }
.d { color:#999; }
.btn {
  padding:13px 48px; background:#44ff44; color:#000;
  border:none; cursor:pointer; font-size:17px; font-family:inherit;
  font-weight:bold; letter-spacing:4px; text-transform:uppercase;
  transition:background .1s,transform .1s; outline:none;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover { background:#66ff66; transform:scale(1.04); }
.btn:active { transform:scale(.97); }
#go-stats { margin:14px 0 22px; text-align:center; color:#aaa; font-size:16px; line-height:2.1; }
#go-stats b { color:#44ff44; }
#ctrl-kb    { display:grid; }
#ctrl-touch { display:none; }
@media (pointer:coarse) { #ctrl-kb { display:none; } #ctrl-touch { display:grid; } }

/* ---- HUD ---- */
#hud { position:fixed; inset:0; pointer-events:none; z-index:10; display:none; }
#xhair {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:22px; height:22px; pointer-events:none;
}
#xhair::before,#xhair::after { content:''; position:absolute; background:rgba(255,255,255,.82); border-radius:1px; }
#xhair::before { width:22px; height:2px; top:10px; left:0; }
#xhair::after  { width:2px; height:22px; top:0; left:10px; }
#xhair.hit::before,#xhair.hit::after { background:#f33; }
#hud-top {
  position:absolute; top:0; left:0; right:0; padding:12px 16px;
  display:flex; justify-content:space-between; align-items:flex-start;
  background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
}
.hud-block { line-height:1.3; }
.hud-block .lbl { color:#888; font-size:10px; letter-spacing:3px; }
.hud-block .val { color:#fff; font-size:19px; }
#wave-val  { color:#ff8800; }
#coins-val { color:#ffd700; }
#hud-bot {
  position:absolute; bottom:0; left:0; right:0; padding:12px 16px;
  display:flex; justify-content:space-between; align-items:flex-end;
  background:linear-gradient(to top,rgba(0,0,0,.6),transparent);
}
#hp-label { color:#888; font-size:10px; letter-spacing:3px; }
#hp-bar { width:160px; height:9px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.22); border-radius:2px; overflow:hidden; margin:4px 0; }
#hp-fill { height:100%; background:#0f0; transition:width .15s,background .3s; border-radius:2px; }
#hp-text { color:#fff; font-size:14px; font-weight:bold; }
#ammo-block { text-align:right; }
#ammo-cur { color:#fff; font-size:clamp(20px,5vw,32px); font-weight:bold; }
#ammo-sep { color:#555; font-size:clamp(16px,4vw,24px); }
#ammo-res { color:#888; font-size:clamp(14px,3vw,20px); }
#reload-msg {
  position:absolute; bottom:60px; right:16px; color:#ff0; font-size:12px; letter-spacing:2px; display:none;
  animation:pulse .5s infinite alternate;
}
@keyframes pulse { from{opacity:.6} to{opacity:1} }
#wave-ann {
  position:absolute; top:38%; left:50%; transform:translate(-50%,-50%);
  color:#44ff44; font-size:clamp(26px,6vw,46px); font-weight:bold; letter-spacing:6px;
  text-align:center; text-shadow:0 0 30px rgba(60,255,60,.8);
  opacity:0; transition:opacity .4s; pointer-events:none;
}
#hit-flash { position:fixed; inset:0; background:rgba(255,0,0,0); pointer-events:none; z-index:9; transition:background .12s ease-out; }
#killfeed { position:absolute; top:68px; right:16px; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
.kf-msg { color:#44ff44; font-size:13px; animation:kfFade 2.2s forwards; }
@keyframes kfFade { 0%{opacity:1;transform:translateX(0)} 80%{opacity:1} 100%{opacity:0;transform:translateX(14px)} }
#enemy-bars { position:fixed; inset:0; pointer-events:none; z-index:8; }
.ebar { position:absolute; transform:translate(-50%,-100%); width:52px; display:flex; flex-direction:column; align-items:center; gap:2px; }
.ebar-bg { width:100%; height:5px; background:rgba(0,0,0,.5); border:1px solid rgba(255,0,0,.4); border-radius:2px; overflow:hidden; }
.ebar-fill { height:100%; background:#f00; border-radius:2px; transition:width .1s; }

/* ================================================================
   SHOP SCREEN
   ================================================================ */
#shop-screen {
  position:fixed; inset:0;
  background:rgba(0,5,0,0.94);
  z-index:60;
  display:flex; flex-direction:column; align-items:center;
  padding:20px 16px 32px;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  opacity:0; pointer-events:none;
  transition:opacity .35s;
}
#shop-screen.open { opacity:1; pointer-events:auto; }

#shop-header { text-align:center; margin-bottom:18px; }
#shop-title {
  font-size:clamp(28px,6vw,44px); letter-spacing:8px; color:#44ff44;
  text-shadow:0 0 24px rgba(60,255,60,.6); margin-bottom:4px;
}
#shop-subtitle { color:#888; font-size:12px; letter-spacing:3px; margin-bottom:10px; }
#shop-coins-row { display:flex; align-items:center; gap:10px; justify-content:center; }
#shop-coins-label { color:#aaa; font-size:13px; letter-spacing:2px; }
#shop-coins-val { color:#ffd700; font-size:clamp(22px,5vw,32px); font-weight:bold; }

/* shop groups replace the flat grid */
.shop-group { width:100%; max-width:780px; margin-bottom:22px; }
.shop-group-header {
  font-size:10px; letter-spacing:4px; font-weight:bold;
  padding:0 0 6px; margin-bottom:10px;
  border-bottom:2px solid var(--gc,#666);
  color:var(--gc,#666);
}
.shop-group-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(155px,1fr));
  gap:10px;
}

.shop-card {
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.1);
  border-top:3px solid #666;
  border-radius:3px; padding:14px 12px;
  display:flex; flex-direction:column; gap:5px;
  cursor:pointer; position:relative;
  transition:background .12s, border-color .12s, transform .1s;
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.shop-card:not(.maxed):not(.broke):hover  { background:rgba(68,255,68,.07); border-color:rgba(68,255,68,.4); }
.shop-card:not(.maxed):not(.broke):active { transform:scale(.97); }
.shop-card.broke  { opacity:.38; cursor:not-allowed; }
.shop-card.maxed  { opacity:.3;  cursor:not-allowed; }
.shop-card.maxed::after {
  content:'MAXED'; position:absolute; top:7px; right:8px;
  color:#888; font-size:9px; letter-spacing:2px;
}
.shop-card.flash { animation:cardFlash .35s ease-out; }
@keyframes cardFlash { 0%{background:rgba(68,255,68,.35)} 100%{background:rgba(255,255,255,.04)} }

.sc-name { color:#fff; font-size:14px; font-weight:bold; letter-spacing:1px; }
.sc-desc { color:#999; font-size:11px; line-height:1.5; flex:1; }
.sc-cost { font-size:17px; font-weight:bold; color:#ffd700; }
.sc-owned { color:#555; font-size:10px; letter-spacing:1px; }

/* category accent colours applied via inline style --ac */
.shop-card { border-top-color: var(--ac, #666); }

#shop-continue {
  padding:13px 56px; background:#44ff44; color:#000;
  border:none; cursor:pointer; font-size:17px; font-family:inherit;
  font-weight:bold; letter-spacing:4px; text-transform:uppercase;
  transition:background .1s,transform .1s; outline:none;
  -webkit-tap-highlight-color:transparent; margin-top:4px; flex-shrink:0;
}
#shop-continue:hover  { background:#66ff66; transform:scale(1.04); }
#shop-continue:active { transform:scale(.97); }

/* ---- Mobile touch controls ---- */
#touch-ui { display:none; }
#joy-zone  { position:fixed; bottom:0; left:0; width:48%; height:50%; z-index:20; touch-action:none; user-select:none; }
#joy-base  { position:absolute; bottom:22px; left:22px; width:128px; height:128px; border-radius:50%; background:rgba(255,255,255,.06); border:2px solid rgba(255,255,255,.16); }
#joy-knob  { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.28); border:2px solid rgba(255,255,255,.5); }
#look-zone { position:fixed; top:0; right:0; width:52%; height:100%; z-index:20; touch-action:none; user-select:none; }
.tc-btn {
  position:fixed; border-radius:50%; z-index:22; touch-action:none; user-select:none;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:11px; font-family:'Courier New',monospace; font-weight:bold;
  -webkit-tap-highlight-color:transparent;
}
#btn-shoot  { width:86px; height:86px; bottom:26px; right:22px; background:rgba(200,30,30,.6);  border:3px solid rgba(255,80,80,.8); }
#btn-jump   { width:60px; height:60px; bottom:132px; right:32px; background:rgba(40,90,210,.5); border:2px solid rgba(80,140,255,.75); }
#btn-reload { width:60px; height:60px; bottom:132px; right:108px; background:rgba(160,120,0,.5); border:2px solid rgba(255,195,0,.75); }
</style>
</head>
<body>

<!-- ── Start Screen ── -->
<div id="start-screen" class="screen">
  <h1>ZOMBIE ARENA</h1>
  <div class="sub">SURVIVE THE WAVES</div>
  <div class="ctrl-grid" id="ctrl-kb">
    <span class="k">W A S D</span><span class="d">Move</span>
    <span class="k">MOUSE</span><span class="d">Aim</span>
    <span class="k">CLICK</span><span class="d">Shoot</span>
    <span class="k">R</span><span class="d">Reload</span>
    <span class="k">SPACE</span><span class="d">Jump</span>
    <span class="k">SHIFT</span><span class="d">Sprint</span>
  </div>
  <div class="ctrl-grid" id="ctrl-touch">
    <span class="k">LEFT THUMB</span><span class="d">Move</span>
    <span class="k">RIGHT SWIPE</span><span class="d">Aim</span>
    <span class="k">FIRE</span><span class="d">Shoot</span>
    <span class="k">JUMP / RELOAD</span><span class="d">Buttons</span>
  </div>
  <button class="btn" id="start-btn">PLAY</button>
</div>

<!-- ── Game Over Screen ── -->
<div id="go-screen" class="screen" style="display:none">
  <h1>YOU DIED</h1>
  <div class="sub">GAME OVER</div>
  <div id="go-stats"></div>
  <button class="btn" id="replay-btn">PLAY AGAIN</button>
</div>

<!-- ── Shop Screen ── -->
<div id="shop-screen">
  <div id="shop-header">
    <div id="shop-title">SHOP</div>
    <div id="shop-subtitle">WAVE <span id="shop-wave-num">1</span> COMPLETE</div>
    <div id="shop-coins-row">
      <span id="shop-coins-label">COINS</span>
      <span id="shop-coins-val">0</span>
    </div>
  </div>
  <div id="shop-groups"></div>
  <button id="shop-continue">NEXT WAVE &rarr;</button>
</div>

<!-- ── HUD ── -->
<div id="hud">
  <div id="hit-flash"></div>
  <div id="xhair"></div>
  <div id="hud-top">
    <div class="hud-block"><div class="lbl">SCORE</div><div class="val" id="score-val">0</div></div>
    <div class="hud-block" style="text-align:center"><div class="lbl" style="text-align:center">WAVE</div><div class="val" id="wave-val">1</div></div>
    <div class="hud-block" style="text-align:right"><div class="lbl" style="text-align:right">COINS</div><div class="val" id="coins-val">0</div></div>
  </div>
  <div id="hud-bot">
    <div>
      <div id="hp-label">HEALTH</div>
      <div id="hp-bar"><div id="hp-fill" style="width:100%"></div></div>
      <div id="hp-text">100</div>
    </div>
    <div id="ammo-block">
      <span id="ammo-cur">30</span><span id="ammo-sep"> / </span><span id="ammo-res">90</span>
    </div>
  </div>
  <div id="reload-msg">RELOADING...</div>
  <div id="wave-ann"></div>
  <div id="killfeed"></div>
</div>

<div id="enemy-bars"></div>

<!-- ── Mobile touch controls ── -->
<div id="touch-ui">
  <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
  <div id="look-zone"></div>
  <div id="btn-shoot" class="tc-btn">FIRE</div>
  <div id="btn-jump"  class="tc-btn">JUMP</div>
  <div id="btn-reload" class="tc-btn">RLD</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';
// ===================================================================
//  ZOMBIE ARENA
// ===================================================================

const isMobile = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ---- Renderer --------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: !isMobile });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !isMobile;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060a06);
scene.fog = new THREE.FogExp2(0x060a06, isMobile ? 0.033 : 0.026);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 200);
scene.add(camera);

// ---- Fixed constants -------------------------------------------
const ARENA   = 22;
const WALL_H  = 8;
const PLR_H   = 1.7;
const PLR_R   = 0.45;
const GRAVITY = -22;
const JUMP_V  = 9;
const SPRINT  = 1.7;
const RELOAD_T = 2.0;

// ---- Upgradeable stats (reset on new game) ---------------------
let gunDamage    = 28;
let fireRate     = 0.10;
let maxClip      = 30;
let maxHp        = 100;
let moveSpeed    = 7;

// ---- Game state ------------------------------------------------
let gState = 'menu';   // menu | playing | shop | dead
let score = 0, coins = 0, wave = 1, kills = 0;

// ---- Player ----------------------------------------------------
const player = {
  pos: new THREE.Vector3(0, PLR_H, 0),
  vel: new THREE.Vector3(),
  hp: 100, onGround: false,
  ammo: 30, reserve: 90,
  reloading: false, reloadT: 0, shootT: 0,
};

// ---- Camera look -----------------------------------------------
let yaw = 0, pitch = 0, camBobT = 0;

// ---- Input -----------------------------------------------------
const keys = new Set();
let shooting = false, locked = false;

// ---- Touch -----------------------------------------------------
const tj = { active:false, id:-1, cx:0, cy:0, dx:0, dy:0 };
const tl = { active:false, id:-1, px:0, py:0 };
const JOY_R = 52;

// ---- Collections -----------------------------------------------
const enemies = [], particles = [], tracers = [], obstacles = [];
const ebarContainer = document.getElementById('enemy-bars');
let eidCounter = 0;

// ===================================================================
//  SHOP SYSTEM
// ===================================================================
const shopBuys = {};

const SHOP_GROUPS = [
  {
    label: 'HEALTH',
    color: '#cc3333',
    items: [
      { id:'health', name:'MED KIT',  desc:'Restore +50 HP',   cost:100, maxBuys:6 },
      { id:'maxhp',  name:'FORTIFY',  desc:'+25 max health',   cost:200, maxBuys:4 },
    ],
  },
  {
    label: 'WEAPONS',
    color: '#ff8800',
    items: [
      { id:'damage',   name:'HOLLOW POINT', desc:'+15 bullet damage',    cost:175, maxBuys:5  },
      { id:'firerate', name:'RAPID FIRE',   desc:'20% faster fire rate', cost:225, maxBuys:3  },
      { id:'clip',     name:'EXT. MAG',     desc:'+10 clip capacity',    cost:175, maxBuys:3  },
      { id:'ammo',     name:'AMMO CRATE',   desc:'+60 reserve ammo',     cost:75,  maxBuys:99 },
    ],
  },
  {
    label: 'MOVEMENT',
    color: '#4488ff',
    items: [
      { id:'speed',  name:'ADRENALINE',   desc:'+15% move speed',     cost:200, maxBuys:3 },
      { id:'reload', name:'SPEED LOADER', desc:'25% faster reload',   cost:200, maxBuys:2 },
    ],
  },
];

let shopReloadMult = 1.0; // tracks reload speed upgrade

function applyUpgrade(id) {
  if (id === 'health')   { player.hp = Math.min(maxHp, player.hp + 50); refreshHealthHUD(); }
  if (id === 'maxhp')    { maxHp += 25; player.hp = Math.min(maxHp, player.hp + 15); refreshHealthHUD(); }
  if (id === 'damage')   { gunDamage += 15; }
  if (id === 'firerate') { fireRate   = Math.max(0.04, fireRate * 0.80); }
  if (id === 'clip')     { maxClip   += 10; player.ammo = maxClip; refreshAmmoHUD(); }
  if (id === 'ammo')     { player.reserve += 60; refreshAmmoHUD(); }
  if (id === 'speed')    { moveSpeed *= 1.15; }
  if (id === 'reload')   { shopReloadMult *= 0.75; }
}

function makeCard(item, groupColor) {
  const bought = shopBuys[item.id] || 0;
  const maxed  = bought >= item.maxBuys;
  const broke  = coins < item.cost;

  const card = document.createElement('div');
  card.className = 'shop-card' + (maxed ? ' maxed' : broke ? ' broke' : '');
  card.style.setProperty('--ac', groupColor);

  const ownedStr = item.maxBuys < 99
    ? `<div class="sc-owned">${bought}/${item.maxBuys}</div>` : '';

  card.innerHTML = `
    <div class="sc-name">${item.name}</div>
    <div class="sc-desc">${item.desc}</div>
    <div class="sc-cost">${item.cost} coins</div>
    ${ownedStr}`;

  if (!maxed && !broke) {
    card.addEventListener('click', () => {
      coins -= item.cost;
      shopBuys[item.id] = (shopBuys[item.id] || 0) + 1;
      applyUpgrade(item.id);
      beep('buy');
      card.classList.add('flash');
      renderShopItems();
    });
  }
  return card;
}

function renderShopItems() {
  const container = document.getElementById('shop-groups');
  container.innerHTML = '';
  document.getElementById('shop-coins-val').textContent = coins;

  for (const group of SHOP_GROUPS) {
    const section = document.createElement('div');
    section.className = 'shop-group';

    const header = document.createElement('div');
    header.className = 'shop-group-header';
    header.style.setProperty('--gc', group.color);
    header.textContent = group.label;
    section.appendChild(header);

    const grid = document.createElement('div');
    grid.className = 'shop-group-grid';
    for (const item of group.items) grid.appendChild(makeCard(item, group.color));
    section.appendChild(grid);

    container.appendChild(section);
  }
}

function openShop() {
  gState = 'shop';
  if (document.pointerLockElement) document.exitPointerLock();
  document.getElementById('hud').style.display       = 'none';
  if (isMobile) document.getElementById('touch-ui').style.display = 'none';
  document.getElementById('shop-wave-num').textContent = wave;
  renderShopItems();
  document.getElementById('shop-screen').classList.add('open');
}

function closeShop() {
  document.getElementById('shop-screen').classList.remove('open');
  document.getElementById('hud').style.display = 'block';
  if (isMobile) document.getElementById('touch-ui').style.display = 'block';

  if (isMobile) {
    gState = 'playing';
    launchWave(wave + 1);
  } else {
    document.body.requestPointerLock();
    const poll = setInterval(() => {
      if (document.pointerLockElement) {
        clearInterval(poll); gState = 'playing'; launchWave(wave + 1);
      }
    }, 50);
    // Fallback if pointer lock is slow
    setTimeout(() => {
      if (gState !== 'playing') { gState = 'playing'; launchWave(wave + 1); }
    }, 3000);
  }
}

document.getElementById('shop-continue').addEventListener('click', closeShop);

// ===================================================================
//  AUDIO
// ===================================================================
let audioCtx = null;
function audio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(type) {
  try {
    const ctx = audio();
    const g = ctx.createGain(); g.connect(ctx.destination);
    const o = ctx.createOscillator(); o.connect(g);
    const t = ctx.currentTime;
    if (type === 'shoot') {
      o.type='sawtooth'; o.frequency.setValueAtTime(260,t); o.frequency.exponentialRampToValueAtTime(55,t+.09);
      g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.1);
      o.start(t); o.stop(t+.1);
    } else if (type === 'hit') {
      o.type='sine'; o.frequency.setValueAtTime(900,t); o.frequency.exponentialRampToValueAtTime(400,t+.06);
      g.gain.setValueAtTime(.2,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
      o.start(t); o.stop(t+.06);
    } else if (type === 'kill') {
      o.type='sine'; o.frequency.setValueAtTime(500,t);
      g.gain.setValueAtTime(.16,t); g.gain.exponentialRampToValueAtTime(.001,t+.2);
      o.start(t); o.stop(t+.2);
      const o2=ctx.createOscillator(), g2=ctx.createGain();
      o2.connect(g2); g2.connect(ctx.destination);
      o2.type='sine'; o2.frequency.setValueAtTime(800,t+.07);
      g2.gain.setValueAtTime(.16,t+.07); g2.gain.exponentialRampToValueAtTime(.001,t+.25);
      o2.start(t+.07); o2.stop(t+.25);
    } else if (type === 'hurt') {
      o.type='sawtooth'; o.frequency.setValueAtTime(120,t); o.frequency.exponentialRampToValueAtTime(50,t+.25);
      g.gain.setValueAtTime(.28,t); g.gain.exponentialRampToValueAtTime(.001,t+.25);
      o.start(t); o.stop(t+.25);
    } else if (type === 'reload') {
      o.type='square'; o.frequency.setValueAtTime(280,t); o.frequency.setValueAtTime(180,t+.06);
      g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.12);
      o.start(t); o.stop(t+.12);
    } else if (type === 'empty') {
      o.type='square'; o.frequency.setValueAtTime(90,t);
      g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.06);
      o.start(t); o.stop(t+.06);
    } else if (type === 'wave') {
      o.type='sine'; o.frequency.setValueAtTime(300,t); o.frequency.linearRampToValueAtTime(900,t+.5);
      g.gain.setValueAtTime(.13,t); g.gain.exponentialRampToValueAtTime(.001,t+.55);
      o.start(t); o.stop(t+.55);
    } else if (type === 'buy') {
      o.type='sine'; o.frequency.setValueAtTime(500,t); o.frequency.setValueAtTime(700,t+.05); o.frequency.setValueAtTime(950,t+.1);
      g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.18);
      o.start(t); o.stop(t+.18);
    } else if (type === 'groan') {
      const lfo=ctx.createOscillator(), lg=ctx.createGain();
      lfo.connect(lg); lg.connect(o.frequency);
      lfo.type='sine'; lfo.frequency.value=4; lg.gain.value=9;
      o.type='sawtooth'; o.frequency.setValueAtTime(80,t); o.frequency.exponentialRampToValueAtTime(60,t+.9);
      g.gain.setValueAtTime(.07,t); g.gain.setValueAtTime(.07,t+.6); g.gain.exponentialRampToValueAtTime(.001,t+.95);
      lfo.start(t); o.start(t); lfo.stop(t+.95); o.stop(t+.95);
    }
  } catch(_) {}
}

function buildWorld() {
  const mFloor = new THREE.MeshLambertMaterial({ color:0x0d1a0d });
  const mCeil  = new THREE.MeshLambertMaterial({ color:0x080e08, side:THREE.BackSide });
  const mWall  = new THREE.MeshLambertMaterial({ color:0x111e11 });
  const mBox   = new THREE.MeshLambertMaterial({ color:0x162216 });
  const mBoxAc = new THREE.MeshLambertMaterial({ color:0x1e301e });

  const floor = new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2,ARENA*2,22,22), mFloor);
  floor.rotation.x = -Math.PI/2; floor.receiveShadow=true; scene.add(floor);
  scene.add(new THREE.GridHelper(ARENA*2, 22, 0x142014, 0x142014));

  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(ARENA*2,ARENA*2), mCeil);
  ceil.position.y=WALL_H; ceil.rotation.x=Math.PI/2; scene.add(ceil);

  for (const [p,ry,sz] of [
    [[0,WALL_H/2,-ARENA],0,[ARENA*2,WALL_H]],
    [[0,WALL_H/2, ARENA],Math.PI,[ARENA*2,WALL_H]],
    [[-ARENA,WALL_H/2,0],Math.PI/2,[ARENA*2,WALL_H]],
    [[ ARENA,WALL_H/2,0],-Math.PI/2,[ARENA*2,WALL_H]],
  ]) {
    const m=new THREE.Mesh(new THREE.PlaneGeometry(sz[0],sz[1]),mWall);
    m.position.set(...p); m.rotation.y=ry; m.receiveShadow=true; scene.add(m);
  }

  for (const [x,z] of [[0,-ARENA+.2],[0,ARENA-.2],[-ARENA+.2,0],[ARENA-.2,0]]) {
    const pl=new THREE.PointLight(0x003300,3,18); pl.position.set(x,.08,z); scene.add(pl);
  }

  for (const [x,z,w,d,h] of [
    [9,9,2.2,2.2,2],[-9,9,2.2,2.2,2],[9,-9,2.2,2.2,2],[-9,-9,2.2,2.2,2],
    [0,13,5,2,2],[0,-13,5,2,2],[13,0,2,5,2],[-13,0,2,5,2],
    [5,0,2,2,1.4],[-5,0,2,2,1.4],[0,5,2,2,1.4],[0,-5,2,2,1.4],
    [16,16,1.5,1.5,2.5],[-16,16,1.5,1.5,2.5],[16,-16,1.5,1.5,2.5],[-16,-16,1.5,1.5,2.5],
  ]) {
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), h>1.8?mBox:mBoxAc);
    mesh.position.set(x,h/2,z); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh);
    obstacles.push({ min:new THREE.Vector3(x-w/2,0,z-d/2), max:new THREE.Vector3(x+w/2,h,z+d/2) });
  }

  scene.add(new THREE.AmbientLight(0x112211, 2.2));
  const sun=new THREE.DirectionalLight(0xffffff,1.0);
  sun.position.set(4,10,6); sun.castShadow=!isMobile;
  if (!isMobile) {
    sun.shadow.camera.left=-28; sun.shadow.camera.right=28;
    sun.shadow.camera.top=28; sun.shadow.camera.bottom=-28;
    sun.shadow.mapSize.setScalar(1024);
  }
  scene.add(sun);

  for (const [cx,cz] of [[-18,-18],[18,-18],[-18,18],[18,18]]) {
    const pl=new THREE.PointLight(0x224422,2,30); pl.position.set(cx,WALL_H-.5,cz); scene.add(pl);
  }
}

// Wave-based zombie variants: [skinColor, clothColor, lightColor]
const Z_VARIANTS = [
  [0x4a7a2a, 0x2a2a14, 0x55ff22],   // fresh zombie — green
  [0x5c4a1e, 0x1c1208, 0xff8800],   // rotting — brown
  [0x3a2050, 0x160a28, 0xcc44ff],   // cursed  — purple
  [0x5a2010, 0x250900, 0xff2200],   // burning — red
];

function spawnZombie(waveNum) {
  const id     = eidCounter++;
  const hp     = 55  + (waveNum-1)*22;
  const speed  = 2.4 + (waveNum-1)*.32;
  const dmg    = 8   + (waveNum-1)*3;
  const [skinCol, clothCol, lightCol] = Z_VARIANTS[Math.min(waveNum-1, Z_VARIANTS.length-1)];

  // Spawn on perimeter, away from player
  let pos;
  for (let a=0; a<30; a++) {
    const side=Math.floor(Math.random()*4);
    let x,z;
    if      (side===0){x=(Math.random()-.5)*(ARENA*2-4);z=-(ARENA-3);}
    else if (side===1){x=(Math.random()-.5)*(ARENA*2-4);z= ARENA-3;}
    else if (side===2){x=-(ARENA-3);z=(Math.random()-.5)*(ARENA*2-4);}
    else              {x= ARENA-3; z=(Math.random()-.5)*(ARENA*2-4);}
    const dx=x-player.pos.x, dz=z-player.pos.z;
    if (Math.sqrt(dx*dx+dz*dz)>10){pos=new THREE.Vector3(x,0,z);break;}
  }
  if (!pos) pos=new THREE.Vector3(-ARENA+4,0,-ARENA+4);

  const g     = new THREE.Group();
  const skin  = new THREE.MeshLambertMaterial({color:skinCol});
  const cloth = new THREE.MeshLambertMaterial({color:clothCol});

  // Torso
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.62,.88,.36),cloth);
  torso.position.y=.52; torso.castShadow=true; g.add(torso);

  // Head
  const head=new THREE.Mesh(new THREE.BoxGeometry(.50,.48,.46),skin);
  head.position.y=1.24; head.castShadow=true; g.add(head);

  // Red glowing eyes
  const eyeMat=new THREE.MeshBasicMaterial({color:0xff1100});
  const eyeGeo=new THREE.BoxGeometry(.10,.07,.05);
  const eL=new THREE.Mesh(eyeGeo,eyeMat); eL.position.set(-.13,1.27,.24); g.add(eL);
  const eR=new THREE.Mesh(eyeGeo,eyeMat); eR.position.set( .13,1.27,.24); g.add(eR);

  // Outstretched zombie arms (reaching forward)
  const armGeo=new THREE.BoxGeometry(.20,.20,.60);
  const aL=new THREE.Mesh(armGeo,skin); aL.position.set(-.44,.88,-.16); g.add(aL);
  const aR=new THREE.Mesh(armGeo,skin); aR.position.set( .44,.88,-.16); g.add(aR);

  // Legs
  const legGeo=new THREE.BoxGeometry(.23,.54,.24);
  const lL=new THREE.Mesh(legGeo,cloth); lL.position.set(-.15,-.1,0); g.add(lL);
  const lR=new THREE.Mesh(legGeo,cloth); lR.position.set( .15,-.1,0); g.add(lR);

  // Glow
  const glow=new THREE.PointLight(lightCol,.9,5);
  glow.position.set(0,1,0); g.add(glow);

  g.position.copy(pos); scene.add(g);

  // HP bar
  const bar=document.createElement('div');
  bar.className='ebar'; bar.id='ebar-'+id;
  bar.innerHTML='<div class="ebar-bg"><div class="ebar-fill" style="width:100%"></div></div>';
  ebarContainer.appendChild(bar);

  if (Math.random()<.35) setTimeout(()=>beep('groan'), Math.random()*800);

  enemies.push({ id, group:g, hp, maxHp:hp, speed, dmg,
    pos:pos.clone(), attackT:0, stagger:0,
    dead:false, deathT:0, legPhase:Math.random()*Math.PI*2, legL:lL, legR:lR });
}

function updateZombieHPBar(z) {
  const el=document.getElementById('ebar-'+z.id);
  if (!el) return;
  if (z.dead){el.style.display='none';return;}
  const ndc=new THREE.Vector3(z.pos.x,2.1,z.pos.z).project(camera);
  if (ndc.z>1){el.style.display='none';return;}
  el.style.display='flex';
  el.style.left=((ndc.x*.5+.5)*innerWidth)+'px';
  el.style.top =((ndc.y*-.5+.5)*innerHeight)+'px';
  const fill=el.querySelector('.ebar-fill');
  if (fill) fill.style.width=Math.max(0,(z.hp/z.maxHp)*100)+'%';
}

function updateZombie(z, dt) {
  if (z.dead) {
    z.deathT+=dt;
    const s=1-z.deathT/.5;
    if (s<=0){ scene.remove(z.group); const el=document.getElementById('ebar-'+z.id); if(el)el.remove(); return true; }
    z.group.scale.setScalar(s); z.group.position.y=s*.3;
    return false;
  }
  if (z.stagger>0) z.stagger-=dt;

  const dx=player.pos.x-z.pos.x, dz=player.pos.z-z.pos.z;
  const dist=Math.sqrt(dx*dx+dz*dz);

  z.group.rotation.y=Math.atan2(dx,dz);

  // Shambling walk animation
  if (dist>1.4 && z.stagger<=0) {
    z.legPhase+=dt*z.speed*3.5;
    const sw=Math.sin(z.legPhase)*.28;
    z.group.rotation.z=Math.sin(z.legPhase*.5)*.06; // body sway
    if (z.legL) z.legL.rotation.x= sw;
    if (z.legR) z.legR.rotation.x=-sw;
  }

  if (dist>1.0 && z.stagger<=0) {
    const nx=dx/dist, nz=dz/dist;
    let nx2=z.pos.x+nx*z.speed*dt, nz2=z.pos.z+nz*z.speed*dt;
    nx2=Math.max(-ARENA+1,Math.min(ARENA-1,nx2));
    nz2=Math.max(-ARENA+1,Math.min(ARENA-1,nz2));
    for (const obs of obstacles) {
      if (nx2+.5>obs.min.x&&nx2-.5<obs.max.x&&nz2+.5>obs.min.z&&nz2-.5<obs.max.z) {
        if (Math.abs(nx)>Math.abs(nz)) nz2=z.pos.z+nz*z.speed*dt*2;
        else                            nx2=z.pos.x+nx*z.speed*dt*2;
        nx2=Math.max(-ARENA+1,Math.min(ARENA-1,nx2));
        nz2=Math.max(-ARENA+1,Math.min(ARENA-1,nz2));
        break;
      }
    }
    z.pos.x=nx2; z.pos.z=nz2;
  }

  if (dist<1.3) {
    z.attackT-=dt;
    if (z.attackT<=0) {
      z.attackT=1.5;
      hurtPlayer(z.dmg);
      if (Math.random()<.4) beep('groan');
    }
  }

  z.group.position.set(z.pos.x,0,z.pos.z);
  updateZombieHPBar(z);
  return false;
}

function killZombie(z) {
  z.dead=true; kills++;
  const pts=100*wave; score+=pts; coins+=pts;
  beep('kill');
  spawnBurst(new THREE.Vector3(z.pos.x,1,z.pos.z),16,0x44ff22);
  addKillFeed('+'+pts);
  refreshScoreHUD();
  refreshCoinsHUD();
  const alive=enemies.filter(e=>!e.dead).length;
  if (alive===0) triggerWaveTransition();
}

// ===================================================================
//  SHOOTING
// ===================================================================
const raycaster = new THREE.Raycaster();
let xhairFlash = 0;

function shoot() {
  if (player.reloading) return;
  if (player.ammo<=0) { beep('empty'); startReload(); return; }
  if (player.shootT>0) return;
  player.ammo--; player.shootT=fireRate;
  beep('shoot'); showMuzzleFlash(); refreshAmmoHUD();
  pitch+=.018+Math.random()*.008; pitch=Math.min(pitch,Math.PI/2.5);

  raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
  const hits=raycaster.intersectObjects(enemies.filter(e=>!e.dead).map(e=>e.group),true);
  if (hits.length>0) {
    let hg=hits[0].object;
    while (hg.parent&&!(hg.parent instanceof THREE.Scene)) hg=hg.parent;
    const z=enemies.find(e=>e.group===hg);
    if (z&&!z.dead) {
      z.hp-=gunDamage; z.stagger=.18;
      beep('hit'); spawnBurst(hits[0].point,6,0x44ff22); flashXhair();
      if (z.hp<=0) killZombie(z);
    }
  }
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  spawnTracer(camera.position.clone().addScaledVector(dir,.8),dir);
  if (player.ammo===0&&!player.reloading) startReload();
}

function flashXhair() { document.getElementById('xhair').classList.add('hit'); xhairFlash=.15; }

function startReload() {
  if (player.reloading||player.reserve<=0||player.ammo===maxClip) return;
  player.reloading=true; player.reloadT=RELOAD_T*shopReloadMult;
  beep('reload'); document.getElementById('reload-msg').style.display='block';
}

function finishReload() {
  const take=Math.min(maxClip-player.ammo,player.reserve);
  player.ammo+=take; player.reserve-=take;
  player.reloading=false;
  document.getElementById('reload-msg').style.display='none';
  refreshAmmoHUD();
}

function spawnBurst(origin,count,color) {
  const mat=new THREE.MeshBasicMaterial({color,transparent:true});
  for (let i=0;i<count;i++) {
    const mesh=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.06),mat.clone());
    mesh.position.copy(origin); scene.add(mesh);
    const vel=new THREE.Vector3((Math.random()-.5)*9,Math.random()*8,(Math.random()-.5)*9);
    particles.push({mesh,vel,life:.4+Math.random()*.2});
  }
}
function spawnTracer(origin,dir) {
  const geo=new THREE.BufferGeometry().setFromPoints([origin.clone(),origin.clone().addScaledVector(dir,18)]);
  const line=new THREE.Line(geo,new THREE.LineBasicMaterial({color:0xffee66,transparent:true,opacity:.85}));
  scene.add(line); tracers.push({line,life:.06});
}

function hurtPlayer(amount) {
  if (player.hp<=0) return;
  player.hp=Math.max(0,player.hp-amount); refreshHealthHUD(); beep('hurt');
  const flash=document.getElementById('hit-flash');
  flash.style.background=`rgba(255,0,0,${.24+(1-player.hp/100)*.24})`;
  setTimeout(()=>{flash.style.background='rgba(255,0,0,0)';},220);
  pitch+=(Math.random()-.5)*.04; yaw+=(Math.random()-.5)*.04;
  if (player.hp<=0) triggerGameOver();
}

function launchWave(num) {
  wave=num;
  const count=5+(num-1)*3;
  enemies.length=0; ebarContainer.innerHTML='';
  for (let i=0;i<count;i++)
    setTimeout(()=>{ if(gState==='playing') spawnZombie(num); },i*420+80);
  refreshWaveHUD();
  announceWave('WAVE '+num);
  beep('wave');
}

function triggerWaveTransition() {
  announceWave('WAVE '+wave+' CLEAR!');
  beep('wave');
  // Brief pause before shop opens
  setTimeout(()=>{ if (gState==='playing') openShop(); }, 2200);
}

function announceWave(txt) {
  const el=document.getElementById('wave-ann');
  el.textContent=txt; el.style.opacity='1';
  setTimeout(()=>{el.style.opacity='0';},2600);
}

function addKillFeed(txt) {

// ===================================================================
//  GAME STATE
// ===================================================================
function startGame() {
  // Reset upgrades
  gunDamage=28; fireRate=0.10; maxClip=30; maxHp=100; moveSpeed=7; shopReloadMult=1.0;
  for (const k in shopBuys) delete shopBuys[k];

  // Reset player
  player.pos.set(0,PLR_H,0); player.vel.set(0,0,0);
  player.hp=100; player.ammo=maxClip; player.reserve=90;
  player.reloading=false; player.shootT=0;
  yaw=0; pitch=0;

  // Reset counters
  score=0; coins=0; wave=1; kills=0;

  // Clear scene objects
  for (const e of enemies) scene.remove(e.group); enemies.length=0;
  ebarContainer.innerHTML='';
  for (const p of particles) scene.remove(p.mesh); particles.length=0;
  for (const t of tracers) scene.remove(t.line); tracers.length=0;

  // UI state
  document.getElementById('start-screen').style.display='none';
  document.getElementById('go-screen').style.display='none';
  document.getElementById('shop-screen').classList.remove('open');
  document.getElementById('hud').style.display='block';
  document.getElementById('reload-msg').style.display='none';
  if (isMobile) document.getElementById('touch-ui').style.display='block';

  refreshHealthHUD(); refreshAmmoHUD(); refreshScoreHUD(); refreshCoinsHUD(); refreshWaveHUD();
  gState='playing';
  launchWave(1);
}

function triggerGameOver() {
  gState='dead';
  document.getElementById('hud').style.display='none';
  document.getElementById('go-screen').style.display='flex';
  document.getElementById('go-stats').innerHTML=
    `Score: <b>${score}</b><br>Wave reached: <b>${wave}</b><br>Zombies killed: <b>${kills}</b>`;
  if (document.pointerLockElement) document.exitPointerLock();
}

// ===================================================================
//  PLAYER UPDATE
// ===================================================================
function updatePlayer(dt) {
  camera.rotation.order='YXZ'; camera.rotation.y=yaw; camera.rotation.x=pitch;

  const fwd  =new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const right=new THREE.Vector3( Math.cos(yaw),0,-Math.sin(yaw));
  const move =new THREE.Vector3();

  if (keys.has('KeyW')||keys.has('ArrowUp'))    move.addScaledVector(fwd,   1);
  if (keys.has('KeyS')||keys.has('ArrowDown'))  move.addScaledVector(fwd,  -1);
  if (keys.has('KeyA')||keys.has('ArrowLeft'))  move.addScaledVector(right,-1);
  if (keys.has('KeyD')||keys.has('ArrowRight')) move.addScaledVector(right, 1);
  if (tj.active&&(tj.dx||tj.dy)) { move.addScaledVector(fwd,-tj.dy); move.addScaledVector(right,tj.dx); }

  const sprinting=keys.has('ShiftLeft')||keys.has('ShiftRight');
  const spd=moveSpeed*(sprinting?SPRINT:1);
  if (move.length()>0) move.normalize().multiplyScalar(spd);

  player.vel.x=move.x; player.vel.z=move.z;
  if (!player.onGround) player.vel.y+=GRAVITY*dt;
  if (keys.has('Space')&&player.onGround) { player.vel.y=JUMP_V; player.onGround=false; }

  player.pos.x+=player.vel.x*dt; player.pos.y+=player.vel.y*dt; player.pos.z+=player.vel.z*dt;
  if (player.pos.y<=PLR_H) { player.pos.y=PLR_H; player.vel.y=0; player.onGround=true; }
  else { player.onGround=false; }
  player.pos.x=Math.max(-ARENA+PLR_R,Math.min(ARENA-PLR_R,player.pos.x));
  player.pos.z=Math.max(-ARENA+PLR_R,Math.min(ARENA-PLR_R,player.pos.z));

  for (const obs of obstacles) {
    if (player.pos.x+PLR_R>obs.min.x&&player.pos.x-PLR_R<obs.max.x&&
        player.pos.z+PLR_R>obs.min.z&&player.pos.z-PLR_R<obs.max.z&&player.pos.y<obs.max.y+.1) {
      const oL=player.pos.x+PLR_R-obs.min.x, oR=obs.max.x-(player.pos.x-PLR_R);
      const oF=player.pos.z+PLR_R-obs.min.z, oB=obs.max.z-(player.pos.z-PLR_R);
      const mn=Math.min(oL,oR,oF,oB);
      if      (mn===oL) player.pos.x=obs.min.x-PLR_R;
      else if (mn===oR) player.pos.x=obs.max.x+PLR_R;
      else if (mn===oF) player.pos.z=obs.min.z-PLR_R;
      else              player.pos.z=obs.max.z+PLR_R;
    }
  }

  const hSpd=Math.sqrt(player.vel.x**2+player.vel.z**2);
  if (player.onGround&&hSpd>.5) { camBobT+=dt*hSpd*.55; camera.position.y=player.pos.y+Math.sin(camBobT*2)*.04; }
  else camera.position.y=player.pos.y;
  camera.position.x=player.pos.x; camera.position.z=player.pos.z;

  if (player.shootT>0) player.shootT-=dt;
  if (shooting&&player.shootT<=0&&!player.reloading) shoot();
  if (player.reloading) { player.reloadT-=dt; if (player.reloadT<=0) finishReload(); }

  gunRecoilY+=(-gunRecoilY)*Math.min(1,dt*18);
  if (gunGroup) gunGroup.position.y=gunBaseY+gunRecoilY;
}

// ===================================================================
//  MAIN LOOP
// ===================================================================
let lastT = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt=Math.min((ts-lastT)/1000,.05); lastT=ts;

  if (gState==='playing') {
    updatePlayer(dt);
    for (let i=enemies.length-1;i>=0;i--) { if (updateZombie(enemies[i],dt)) enemies.splice(i,1); }
    for (let i=particles.length-1;i>=0;i--) {
      const p=particles[i]; p.life-=dt;
      p.mesh.position.addScaledVector(p.vel,dt); p.vel.y-=14*dt;
      p.mesh.material.opacity=Math.max(0,p.life/.4);
      if (p.life<=0) { scene.remove(p.mesh); particles.splice(i,1); }
    }
    for (let i=tracers.length-1;i>=0;i--) {
      const tr=tracers[i]; tr.life-=dt;
      tr.line.material.opacity=Math.max(0,tr.life/.06);
      if (tr.life<=0) { scene.remove(tr.line); tracers.splice(i,1); }
    }
    if (muzzleTimer>0) { muzzleTimer-=dt; if (muzzleTimer<=0){const f=gunGroup&&gunGroup.getObjectByName('muzzleFlash');if(f)f.visible=false;} }
    if (xhairFlash>0) { xhairFlash-=dt; if (xhairFlash<=0) document.getElementById('xhair').classList.remove('hit'); }
  }

  renderer.render(scene,camera);
}

// ===================================================================
//  INPUT
// ===================================================================
function setupDesktopInput() {
  document.addEventListener('keydown', e=>{
    keys.add(e.code);
    if (e.code==='KeyR'&&gState==='playing') startReload();
  });
  document.addEventListener('keyup', e=>keys.delete(e.code));
  document.addEventListener('mousedown', e=>{ if (e.button===0&&locked&&gState==='playing'){shooting=true;shoot();} });
  document.addEventListener('mouseup',   e=>{ if (e.button===0) shooting=false; });
  document.addEventListener('mousemove', e=>{
    if (!locked) return;
    yaw-=e.movementX*.0018; pitch-=e.movementY*.0018;
    pitch=Math.max(-Math.PI/2.3,Math.min(Math.PI/2.3,pitch));
  });
  document.addEventListener('pointerlockchange',()=>{ locked=document.pointerLockElement!==null; });
  document.addEventListener('contextmenu',e=>e.preventDefault());
}

function setupTouchInput() {
  if (!isMobile) return;
  document.getElementById('touch-ui').style.display='block';
  const joyZone=document.getElementById('joy-zone');
  const joyBase=document.getElementById('joy-base');
  const joyKnob=document.getElementById('joy-knob');
  const lookZone=document.getElementById('look-zone');

  joyZone.addEventListener('touchstart',e=>{
    e.preventDefault();
    for (const t of e.changedTouches) if (!tj.active){
      tj.active=true; tj.id=t.identifier;
      const r=joyZone.getBoundingClientRect();
      tj.cx=t.clientX; tj.cy=t.clientY; tj.dx=0; tj.dy=0;
      joyBase.style.left=(t.clientX-r.left-64)+'px';
      joyBase.style.top =(t.clientY-r.top -64)+'px';
    }
  },{passive:false});
  joyZone.addEventListener('touchmove',e=>{
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier===tj.id){
      const dx=t.clientX-tj.cx, dy=t.clientY-tj.cy;
      const len=Math.sqrt(dx*dx+dy*dy), c=Math.min(len,JOY_R);
      tj.dx=(len>0?dx/len:0)*(c/JOY_R); tj.dy=(len>0?dy/len:0)*(c/JOY_R);
      joyKnob.style.transform=`translate(calc(-50% + ${tj.dx*JOY_R}px),calc(-50% + ${tj.dy*JOY_R}px))`;
    }
  },{passive:false});
  const joyEnd=e=>{ for (const t of e.changedTouches) if (t.identifier===tj.id){ tj.active=false;tj.id=-1;tj.dx=0;tj.dy=0;joyKnob.style.transform='translate(-50%,-50%)'; } };
  joyZone.addEventListener('touchend',joyEnd,{passive:false});
  joyZone.addEventListener('touchcancel',joyEnd,{passive:false});

  lookZone.addEventListener('touchstart',e=>{ e.preventDefault(); for (const t of e.changedTouches) if (!tl.active){tl.active=true;tl.id=t.identifier;tl.px=t.clientX;tl.py=t.clientY;} },{passive:false});
  lookZone.addEventListener('touchmove',e=>{
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier===tl.id){
      yaw-=(t.clientX-tl.px)*.0034; pitch-=(t.clientY-tl.py)*.0034;
      pitch=Math.max(-Math.PI/2.3,Math.min(Math.PI/2.3,pitch));
      tl.px=t.clientX; tl.py=t.clientY;
    }
  },{passive:false});
  const lookEnd=e=>{ for (const t of e.changedTouches) if (t.identifier===tl.id){tl.active=false;tl.id=-1;} };
  lookZone.addEventListener('touchend',lookEnd,{passive:false});
  lookZone.addEventListener('touchcancel',lookEnd,{passive:false});

  const bs=document.getElementById('btn-shoot');
  bs.addEventListener('touchstart',e=>{ e.preventDefault(); if(gState==='playing'){shooting=true;shoot();} },{passive:false});
  bs.addEventListener('touchend',  e=>{ e.preventDefault(); shooting=false; },{passive:false});
  bs.addEventListener('touchcancel',e=>{ e.preventDefault(); shooting=false; },{passive:false});

  const bj=document.getElementById('btn-jump');
  bj.addEventListener('touchstart',e=>{ e.preventDefault(); keys.add('Space'); },{passive:false});
  bj.addEventListener('touchend',  e=>{ e.preventDefault(); keys.delete('Space'); },{passive:false});

  document.getElementById('btn-reload').addEventListener('touchstart',e=>{ e.preventDefault(); if(gState==='playing') startReload(); },{passive:false});
}

function attachPlay(id) {
  document.getElementById(id).addEventListener('click',()=>{
    if (isMobile) { startGame(); }
    else {
      document.body.requestPointerLock();
      const poll=setInterval(()=>{ if(document.pointerLockElement){clearInterval(poll);startGame();} },50);
    }
  });
}

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

// ===================================================================
//  INIT
// ===================================================================
buildWorld();
buildGun();
setupDesktopInput();
setupTouchInput();
attachPlay('start-btn');
attachPlay('replay-btn');
requestAnimationFrame(loop);
</script>
