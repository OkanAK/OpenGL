<title>Medicare Fridays</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Layout: one short column — number, month, the lines, a copy button. */
:root {
  --bg: #f3f6f5;
  --fg: #16231f;
  --muted: #5b6b66;
  --line: #cfdad6;
  --field: #ffffff;
  --accent: #0d6b57;
  --accent-ink: #ffffff;
  --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, Menlo, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101816; --fg: #e4ece9; --muted: #95a8a1; --line: #2c3c37;
    --field: #17221f; --accent: #4fc2a4; --accent-ink: #08201a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101816; --fg: #e4ece9; --muted: #95a8a1; --line: #2c3c37;
  --field: #17221f; --accent: #4fc2a4; --accent-ink: #08201a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font-body); }
.wrap {
  max-width: 480px; margin: 0 auto; display: grid; gap: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px;
}
h1 { margin: 0; font-size: 1.6rem; }
label { display: grid; gap: 4px; font-weight: 600; font-size: .9rem; }
input, textarea {
  font: inherit; color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px; width: 100%;
}
input#medicare, textarea { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
textarea { min-height: 180px; resize: vertical; line-height: 1.6; }
input:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button {
  font: inherit; font-weight: 600; cursor: pointer; border: 0; border-radius: 6px;
  padding: 12px 16px; background: var(--accent); color: var(--accent-ink);
}
.copyrow { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.toast { color: var(--accent); font-weight: 600; }
.note { margin: 0; color: var(--muted); font-size: .85rem; }
</style>

<div class="wrap">
  <h1>Medicare Fridays</h1>
  <label>Medicare number
    <input id="medicare" inputmode="numeric" autocomplete="off" placeholder="2123 45670 1">
  </label>
  <label>Month
    <input id="month" type="month">
  </label>
  <textarea id="output" readonly aria-label="Lines to copy"></textarea>
  <div class="copyrow">
    <button id="copyBtn" type="button">Copy</button>
    <span id="toast" class="toast" role="status"></span>
  </div>
  <p class="note">The number is remembered on this device only.</p>
</div>

<script>
(function () {
  const KEY = "medicare-fridays-number";
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");

  try { $("medicare").value = localStorage.getItem(KEY) || ""; } catch (e) {}
  const now = new Date();
  $("month").value = now.getFullYear() + "-" + pad(now.getMonth() + 1);

  function fridaysOf(year, monthIdx) {
    const out = [];
    const d = new Date(year, monthIdx, 1);
    d.setDate(1 + ((5 - d.getDay() + 7) % 7));
    while (d.getMonth() === monthIdx) { out.push(new Date(d)); d.setDate(d.getDate() + 7); }
    return out;
  }

  function render() {
    const num = $("medicare").value.trim() || "2123 45670 1";
    const [y, m] = ($("month").value || "").split("-").map(Number);
    const days = y && m ? fridaysOf(y, m - 1) : [];
    $("output").value = days
      .map((d) => num + " " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear())
      .join("\n");
  }

  $("medicare").addEventListener("input", () => {
    try { localStorage.setItem(KEY, $("medicare").value.trim()); } catch (e) {}
    render();
  });
  $("month").addEventListener("change", render);

  $("copyBtn").addEventListener("click", () => {
    const ta = $("output");
    const done = (ok) => {
      $("toast").textContent = ok ? "Copied" : "Selected. Press Ctrl+C, or long-press and Copy.";
      setTimeout(() => { $("toast").textContent = ""; }, 3000);
    };
    const fallback = () => {
      ta.focus(); ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      done(ok);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(ta.value).then(() => done(true), fallback);
    } else fallback();
  });

  render();
})();
</script>
